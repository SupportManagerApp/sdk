              example: { data: { id: '1', type: payslips, attributes: { team_id: 1, user_id: 5, process_date: '2024-03-28', total_gross: '2500.00', net_pay_formatted: '1875.00', status: published, payments: [{ description: 'Basic Pay', hours: 160.0, rate: '15.00', total: '2400.00' }, { description: Overtime, hours: 8.0, rate: '22.50', total: '180.00' }], deductions: [{ description: 'PAYE Tax', total: '450.00' }, { description: 'National Insurance', total: '175.00' }], period_totals: [{ label: 'Gross Pay', value: '2580.00' }, { label: 'Total Deductions', value: '625.00' }, { label: 'Net Pay', value: '1955.00' }], ytd_totals: [{ label: 'Gross Pay YTD', value: '30000.00' }, { label: 'Tax YTD', value: '5400.00' }, { label: 'NI YTD', value: '2100.00' }] } }, meta: { team_id: 1 } }
