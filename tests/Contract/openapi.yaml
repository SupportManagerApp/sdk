      description: "Autocomplete a postcode or partial address with the same lookup the\nweb profile uses. Pass a suggestion's `id` to\n`/user/address/suggestions/{id}` to get fields ready for\n`PUT /user/address`.\n\n**Authorization:** All roles except former PAs.\n"
