      properties:
        id:
          type: string
          description: 'Unique identifier'
          example: '1'
        type:
          type: string
          example: pay-enhancements
        attributes:
          type: object
          properties:
            name:
              type: string
              description: 'Name of the pay enhancement'
              example: 'Bank Holiday'
            description:
              type: string
              nullable: true
              description: 'Optional description of when this enhancement applies'
              example: 'Enhanced rate for bank holiday shifts'
            enhancement_factor:
              type: string
              description: "The multiplier factor value\n\nKnown values: `0.25`, `0.50`, `0.75`, `1`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: '1'
            enhancement_factor_label:
              type: string
              description: "Human-readable label for the enhancement factor\n\nKnown values: `Time and a quarter`, `Time and a half`, `Time and three quarters`, `Double time`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: 'Double time'
            created_at:
              type: string
              format: date-time
              nullable: true
              description: 'ISO-8601 timestamp of creation'
              example: '2024-01-15T10:30:00.000000Z'
            updated_at:
              type: string
              format: date-time
              nullable: true
              description: 'ISO-8601 timestamp of last update'
              example: '2024-01-15T10:30:00.000000Z'
    PayEnhancementInput:
      type: object
      description: 'Input for creating or updating a pay enhancement'
      required:
        - name
        - enhancement_factor
      properties:
        name:
          type: string
          description: 'Name of the pay enhancement'
          maxLength: 255
          example: 'Bank Holiday'
        description:
          type: string
          nullable: true
          description: 'Optional description'
          maxLength: 500
          example: 'Enhanced rate for bank holiday shifts'
        enhancement_factor:
          type: string
          description: "The enhancement factor value:\n- `0.25` = Time and a quarter (1.25x)\n- `0.50` = Time and a half (1.5x)\n- `0.75` = Time and three quarters (1.75x)\n- `1` = Double time (2x)\n"
          enum:
            - '0.25'
            - '0.50'
            - '0.75'
            - '1'
          example: '1'
