  /dashboard:
    get:
      operationId: getSanctumDashboard
      summary: 'Get the dashboard layout'
      description: "Retrieve the widgets, quick links and alerts the web dashboard shows the\nauthenticated user in the current team.\n\nWidgets are left out when the team's plan lacks the feature they need,\nthe team has switched their optional module off, the user's role should\nnot see them (including former PAs), or their display condition is not\nmet. They come back sorted by priority.\n\nQuick links follow the same rules as the web navigation: the Car\nJourneys and Household links only appear while the user can open the\nHome tab (shift workers only from an hour before their shift until an\nhour after it), and former PAs only get the links to pages they can\nstill open.\n\nAlerts are the same \"needs your attention\" items the web navigation\nshows, such as leave waiting for a manager's approval.\n\n**Authorization:** Every role, including former PAs. Returns `403` when\nthe team has no active subscription.\n"
      tags:
        - Dashboard
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Dashboard layout retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { widgets: { type: array, items: { $ref: '#/components/schemas/DashboardWidgetPlacement' } }, quick_links: { type: array, items: { $ref: '#/components/schemas/DashboardQuickLink' } }, alerts: { type: array, items: { $ref: '#/components/schemas/DashboardAlert' } } } }, meta: { type: object, properties: { team_id: { type: integer } } } } }
              example: { data: { widgets: [{ key: dashboard.weather, width: full, priority: 10 }, { key: leave.leave-summary, width: half, priority: 210 }], quick_links: [{ label: Rota, description: 'Check the team schedule', icon: heroicon-o-user-group, color: orange, url: 'https://suptmgr.test/acme-care/rota' }], alerts: [{ description: '2 leave requests to approve', count: 2, location: 'Time off › Approvals', icon: plane, url: 'https://suptmgr.test/acme-care/leave-admin/approvals' }] }, meta: { team_id: 1 } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          description: 'The token is not an access token, or the team has no active subscription'
        500:
          $ref: '#/components/responses/ServerError'
