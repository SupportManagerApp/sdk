  /household/chores:
    get:
      operationId: getChores
      summary: 'List chores'
      description: "Retrieve a paginated list of chores for the authenticated user's team.\n\nSupports filtering by name, frequency, completed_by user, chore_category_id, and due status.\nEach chore carries `meta.can` saying whether the user may edit or delete it.\nResults are sorted by created_at descending by default.\n"
      tags:
        - Chores
      security:
        -
          sanctum: {}
      parameters:
        -
          name: X-Team-ID
          in: header
          description: 'Team ID for tenant context'
          required: true
          schema:
            type: integer
          example: 1
        -
          name: page
          in: query
          description: 'Page number for pagination'
          schema:
            type: integer
            minimum: 1
          example: 1
        -
          name: per_page
          in: query
          description: 'Number of items per page'
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 15
        -
          name: 'filter[name]'
          in: query
          description: 'Filter by chore name (partial match)'
          schema:
            type: string
          example: kitchen
        -
          name: 'filter[frequency]'
          in: query
          description: 'Filter by chore frequency'
          schema:
            type: string
            enum:
              - Daily
              - 'Three Days'
              - Weekly
              - Fortnightly
              - Monthly
              - Custom
          example: Weekly
        -
          name: 'filter[completed_by]'
          in: query
          description: 'Filter by the ID of the user who last completed the chore'
          schema:
            type: integer
          example: 5
        -
          name: 'filter[chore_category_id]'
          in: query
          description: 'Filter by chore category ID'
          schema:
            type: integer
          example: 1
        -
          name: 'filter[due]'
          in: query
          description: "`true` returns only the chores due now, exactly as the web chore list shows them:\nchores planned for today or earlier, chores never completed, and chores whose frequency\nhas elapsed since they were last completed. Snoozed chores (including those marked\nnot needed today) are left out. `false` returns every other chore.\n"
          schema:
            type: boolean
          example: true
        -
          name: sort
          in: query
          description: 'Sort field (prefix with - for descending)'
          schema:
            type: string
            enum:
              - name
              - created_at
              - last_completed
              - frequency
              - '-name'
              - '-created_at'
              - '-last_completed'
              - '-frequency'
          example: '-created_at'
      responses:
        200:
          description: 'Chores retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Chore' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { $ref: '#/components/schemas/HouseholdPaginationLinks' } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createChore
      summary: 'Create chore'
      description: "Create a new chore for the authenticated user's team.\n\nWhen `frequency` is `Custom`, `custom_frequency_days` is required (1-365).\n"
      tags:
        - Chores
      security:
        -
          sanctum: {}
      parameters:
        -
          name: X-Team-ID
          in: header
          description: 'Team ID for tenant context'
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoreCreate'
            example:
              name: 'Clean kitchen'
              description: 'Wipe down surfaces and clean appliances'
              frequency: Weekly
      responses:
        201:
          description: 'Chore created successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Chore' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/HouseholdValidationError'
        500:
          $ref: '#/components/responses/ServerError'
