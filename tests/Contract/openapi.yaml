            is_view_only:
              type: boolean
              description: "True for former PAs, who can read their profile but not change\nit. Hide edit controls when true.\n"
            address:
              description: "The user's address envelope for the current team. Only present\nwhen the `address` relationship is loaded (the profile endpoint\neager-loads it, so it is included in practice). `data` is null\nwhen the user has no address on file.\n"
              type: object
              nullable: true
              allOf: [{ $ref: '#/components/schemas/Address' }]
            emergency_contacts:
              description: "All of the user's emergency contacts for the current team.\nOnly present when the relationship is loaded (the profile\nendpoints always load it). Empty when there are none.\n"
              type: array
