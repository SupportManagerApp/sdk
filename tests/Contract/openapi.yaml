# Vendored copy of the SupportManager platform's merged OpenAPI spec, used only
# by the SDK's contract tests (tests/Contract). Do not edit by hand: regenerate
# with `composer sync-openapi -- <platform-path>`.
#
# platform-commit: 55ec39dea
openapi: 3.0.3
info:
  title: 'SupportManager API'
  description: "# SupportManager API\n\nA REST API for personal assistant and team management with multi-tenant architecture.\n\n## Features\n\n- **User Management**: Authentication with Face ID support and team collaboration\n- **Holiday Management**: Time-off tracking with approval workflows\n- **Scheduling**: Shift management and rota planning\n- **Documents**: Secure storage for payslips, contracts, and important files\n- **Journey Tracking**: Vehicle usage and travel expense monitoring\n- **Dashboard**: Task management and shopping lists\n\n## Authentication\n\nUses Laravel Sanctum with dual tokens:\n- **Access Tokens**: 1-hour lifespan for API requests\n- **Refresh Tokens**: 30-day lifespan for seamless renewal\n\n## API Details\n\n- **Base URL**: `https://app.support-manager.co.uk/api/v1`\n- **Format**: [JSON:API](https://jsonapi.org/) responses (`application/json`) with `data` envelope containing `id`, `type`, and `attributes`\n- **Timestamps**: ISO-8601 with an explicit UTC offset, e.g.\n  `2026-08-13T09:00:00+01:00`. Parse the offset — do not assume UTC.\n\n  Times someone entered — shift and appointment starts and ends, leave\n  dates — carry the offset in force where the team works on that date, so\n  the same clock face is `+01:00` in summer and `+00:00` in winter. A shift\n  running overnight across a daylight-saving change will have a different\n  offset at each end; that is correct, and it means the elapsed time\n  between the two is not always the number of hours on the clock. Where an\n  endpoint reports hours worked (`duration`), use that figure rather than\n  subtracting the timestamps yourself.\n\n  Times the server recorded — `created_at`, `updated_at`, `expires_at` and\n  the like — are UTC instants and end in `Z`.\n- **Pagination**: `?page=1&per_page=50` (max 100)\n"
  version: 1.0.0
  contact:
    name: 'SupportManager Ltd'
    url: 'https://support-manager.co.uk'
    email: hola@support-manager.co.uk
  license:
    name: Proprietary
    url: 'https://app.support-manager.co.uk/terms'
servers:
  -
    url: 'https://suptmgr.test/api/v1'
    description: 'Local development server'
  -
    url: 'https://app.share.support-manager.co.uk/api/v1'
    description: 'Local share server (expose tunnel)'
  -
    url: 'https://app.support-manager.co.uk/api/v1'
    description: 'Production server'
  -
    url: 'https://suptmgr-staging.laravel.cloud/api/v1'
    description: 'Staging server'
  -
    url: 'https://suptmgr-develop.laravel.cloud/api/v1'
    description: 'Develop server'
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: 'Use the access token obtained from the login endpoint'
    verificationSession:
      type: apiKey
      in: header
      name: Authorization
      description: "Verification session token obtained from a 403 response during login.\nFormat: `VerificationSession <token>`\n\nExample: `Authorization: VerificationSession abc123xyz789...`\n"
    oauth2:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Passport access token. The required scope is listed on each operation.\n"
  parameters:
    XTeamID:
      name: X-Team-ID
      in: header
      required: true
      description: 'Team ID for tenant context'
      schema:
        type: integer
      example: 1
    Page:
      name: page
      in: query
      description: 'Page number for pagination'
      schema:
        type: integer
        minimum: 1
      example: 1
    PerPage:
      name: per_page
      in: query
      description: 'Number of items per page'
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 15
    AccidentsTeamId:
      name: X-Team-ID
      in: header
      description: 'Team ID for tenant context'
      required: true
      schema:
        type: integer
      example: 1
    AccidentReportId:
      name: accidentReport
      in: path
      description: 'Accident report ID'
      required: true
      schema:
        type: integer
      example: 7
    CompliancePerPage:
      name: per_page
      in: query
      description: 'Number of items per page. Values above 100 are capped at 100.'
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 15
    DBSCheckId:
      name: id
      in: path
      required: true
      description: 'DBS check ID'
      schema:
        type: integer
      example: 1
    RightToWorkId:
      name: id
      in: path
      required: true
      description: 'Right-to-work record ID'
      schema:
        type: integer
      example: 1
    DriversLicenceCheckId:
      name: id
      in: path
      required: true
      description: 'Drivers licence check ID'
      schema:
        type: integer
      example: 1
    DocumentId:
      name: id
      in: path
      required: true
      description: 'Document ID'
      schema:
        type: integer
      example: 1
    DocumentFolderId:
      name: id
      in: path
      required: true
      description: 'Document folder ID'
      schema:
        type: integer
      example: 1
    PolicyId:
      name: id
      in: path
      required: true
      description: 'Policy ID'
      schema:
        type: integer
      example: 1
    HolidayRequestId:
      name: id
      in: path
      required: true
      description: 'Holiday request ID'
      schema:
        type: integer
      example: 1
    AdjustmentId:
      name: id
      in: path
      required: true
      description: 'Manual adjustment ID'
      schema:
        type: integer
      example: 1
    EntitlementId:
      name: id
      in: path
      required: true
      description: 'Holiday entitlement ID'
      schema:
        type: integer
      example: 1
    NotificationId:
      name: notification
      in: path
      required: true
      description: 'UUID of the notification'
      schema:
        type: string
        format: uuid
        example: 9d8f1a2b-1c3d-4e5f-8a9b-1c2d3e4f5a6b
    PayslipId:
      name: id
      in: path
      required: true
      description: 'Payslip ID'
      schema:
        type: integer
      example: 1
    P60Id:
      name: id
      in: path
      required: true
      description: 'P60 document ID'
      schema:
        type: integer
      example: 1
    P45Id:
      name: id
      in: path
      required: true
      description: 'P45 document ID'
      schema:
        type: integer
      example: 1
    PayEnhancementId:
      name: id
      in: path
      required: true
      description: 'Pay enhancement ID'
      schema:
        type: integer
      example: 1
    TimesheetId:
      name: id
      in: path
      required: true
      description: 'Timesheet ID'
      schema:
        type: integer
      example: 1
    SigningTeamId:
      name: X-Team-ID
      in: header
      required: true
      description: 'Team ID for tenant context'
      schema:
        type: integer
      example: 1
    SigningRequestId:
      name: id
      in: path
      required: true
      description: 'Signature request ID'
      schema:
        type: integer
      example: 12
    UserPerPage:
      name: per_page
      in: query
      description: 'Number of items per page'
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 20
    UserId:
      name: id
      in: path
      required: true
      description: 'User ID'
      schema:
        type: integer
      example: 5
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: 'The given data was invalid.'
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: 'The given data was invalid.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PaginationMeta:
      type: object
      properties:
        team_id:
          type: integer
          example: 1
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          nullable: true
          example: 1
        to:
          type: integer
          nullable: true
          example: 15
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 42
        last_page:
          type: integer
          example: 3
    AccidentReport:
      type: object
      properties:
        id:
          type: string
          example: '7'
        type:
          type: string
          example: accident-reports
        attributes:
          type: object
          properties:
            report_number:
              type: integer
              description: "Sequential number of the report within the team's accident book"
              example: 3
            riddor_reportable:
              type: boolean
              description: 'Whether the accident has been marked reportable to the HSE under RIDDOR'
              example: false
            subject:
              type: object
              description: 'The person who had the accident'
              properties: { user_id: { type: integer, nullable: true, description: 'Set when the person is a member of the team', example: 12 }, name: { type: string, example: 'Jamie Doe' }, occupation: { type: string, nullable: true, description: "The capacity someone outside the team was there in, such as\nVisitor, Family, Contractor or Other. Null for team members.\n", example: null } }
            reporter:
              type: object
              description: 'The person who recorded the accident'
              properties: { user_id: { type: integer, nullable: true, example: 4 }, name: { type: string, example: 'Sam Carer' } }
            happened_at:
              type: string
              format: date-time
              description: 'When the accident happened, in UK local time with its offset'
              example: '2026-10-30T14:15:00+00:00'
            location:
              type: string
              example: Kitchen
            how_it_happened:
              type: string
              example: 'Slipped on a wet floor while carrying the shopping in.'
            cause:
              type: string
              nullable: true
              example: 'Spilt water by the sink'
            injury_details:
              type: string
              nullable: true
              example: 'Bruised left knee'
            reporter_declaration:
              $ref: '#/components/schemas/AccidentDeclaration'
            subject_declaration:
              $ref: '#/components/schemas/AccidentPendingDeclaration'
            riddor:
              type: object
              description: "How the accident was reported to the HSE. Only included for\nadmins and managers.\n"
              properties: { how_reported: { type: string, nullable: true, example: 'Submitted through the HSE online form, reference 1234567.' }, declared_name: { type: string, nullable: true, example: 'Morgan Manager' }, declared_at: { type: string, format: date-time, nullable: true, example: '2026-10-31T09:30:00.000000Z' } }
            created_at:
              type: string
              format: date-time
              example: '2026-10-30T14:20:00.000000Z'
            updated_at:
              type: string
              format: date-time
              example: '2026-10-30T14:20:00.000000Z'
        meta:
          type: object
          properties:
            can:
              type: object
              description: 'What the authenticated user may do with this report'
              properties: { record_subject_declaration: { type: boolean, description: "Whether to offer `POST /accidents/{accidentReport}/subject-declaration`.\nFalse once the report is confirmed or when the reporter had the accident.\n", example: true } }
    AccidentDeclaration:
      type: object
      properties:
        name:
          type: string
          example: 'Sam Carer'
        declared_at:
          type: string
          format: date-time
          example: '2026-10-30T14:20:00.000000Z'
    AccidentPendingDeclaration:
      type: object
      description: 'Both fields are null until the person who had the accident confirms the report.'
      properties:
        name:
          type: string
          nullable: true
          example: null
        declared_at:
          type: string
          format: date-time
          nullable: true
          example: null
    AccidentReportCreate:
      type: object
      required:
        - subject
        - happened_at
        - location
        - how_it_happened
        - reporter_declared_name
      properties:
        subject:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [me, team_member, other]
              description: 'Who had the accident'
            user_id:
              type: integer
              description: 'Required when type is team_member. Must be a member of the current team.'
            name:
              type: string
              maxLength: 255
              description: 'Required when type is other.'
            capacity:
              type: string
              enum: [Visitor, Family, Contractor, Other]
              description: 'Required when type is other.'
        happened_at:
          type: string
          format: date-time
          description: 'When it happened. Must not be in the future.'
        location:
          type: string
          maxLength: 255
        how_it_happened:
          type: string
          maxLength: 5000
        cause:
          type: string
          maxLength: 2000
          nullable: true
        injury_details:
          type: string
          maxLength: 2000
          nullable: true
        reporter_declared_name:
          type: string
          maxLength: 255
          description: "The reporter's typed name, declaring the record accurate"
        subject_declared_name:
          type: string
          maxLength: 255
          nullable: true
          description: "The injured person's typed name, if they can confirm now. Ignored when type is me."
    AccidentSubjectDeclarationCreate:
      type: object
      required:
        - subject_declared_name
      properties:
        subject_declared_name:
          type: string
          maxLength: 255
    AccidentTeamMeta:
      type: object
      properties:
        team_id:
          type: integer
          example: 1
    AccidentPaginationMeta:
      type: object
      properties:
        team_id:
          type: integer
          example: 1
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          nullable: true
          example: 1
        to:
          type: integer
          nullable: true
          example: 15
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 42
        last_page:
          type: integer
          example: 3
    AccidentPaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/accidents?page=1'
        last:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/accidents?page=3'
        prev:
          type: string
          nullable: true
          example: null
        next:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/accidents?page=2'
    AccidentError:
      type: object
      properties:
        message:
          type: string
    AccidentValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        meta:
          $ref: '#/components/schemas/AccidentTeamMeta'
    DevLoginUser:
      type: object
      description: "An account offered on the developer login picker. Carries only what the\npicker needs to label and group the list.\n"
      properties:
        id:
          type: integer
          description: 'Pass this as `user_id` to `/auth/dev/login`.'
          example: 1
        name:
          type: string
          example: 'Alex Harbourne'
        email:
          type: string
          format: email
          example: alex.harbourne@example.com
        teams:
          type: array
          description: "Every team this account belongs to, with the role and status it\nholds in that team. Empty for an account not yet added to a team.\n"
          items:
            type: object
            properties:
              id: { type: integer, description: 'Use as the `X-Team-ID` value on subsequent requests.', example: 1 }
              slug: { type: string, description: 'Subdomain the team is served on.', example: te-care }
              name: { type: string, example: 'TE Care' }
              role: { type: string, nullable: true, description: "Known values: `Admin`, `Manager`, `PA`, `Family Member`,\n`Contractor`. This list is open and may grow — clients must\nignore values they do not recognise rather than failing to\ndecode the response. Null if the account has no settings row\nfor that team.\n", example: PA }
              status: { type: string, nullable: true, description: "Known values: `Active`, `Inactive`, `Invited`,\n`Ready to invite`. This list is open and may grow — clients\nmust ignore values they do not recognise.\n", example: Active }
    DeviceVerificationRequiredResponse:
      type: object
      description: 'Response returned when device verification is required'
      properties:
        message:
          type: string
          example: 'Device verification required'
        error_code:
          type: string
          example: DEVICE_VERIFICATION_REQUIRED
        data:
          type: object
          properties:
            verification_token:
              type: string
              description: "Temporary token for the verification session. Include this in the\n`Authorization` header as `VerificationSession <token>` for subsequent\ndevice verification requests.\n"
              example: abc123xyz789...
            verification_token_expires_in:
              type: integer
              description: 'Token expiration time in seconds'
              example: 300
            available_methods:
              type: array
              description: 'List of available verification methods for this user'
              items: { $ref: '#/components/schemas/VerificationMethod' }
            user:
              type: object
              description: 'Basic user information for display purposes'
              properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'John Doe' } }
    VerificationMethod:
      type: object
      description: 'A verification method available to the user'
      properties:
        method:
          type: string
          description: "Method identifier.\n\nKnown values: `email`, `sms`, `totp`, `backup_code`, `passkey`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n\nThis field is deliberately not a closed enum. A generated client that\nrejects unknown values fails to decode the whole response, so adding a\nmethod server-side would lock every installed build out of login.\n"
          example: email
        label:
          type: string
          description: 'Human-readable label for the method'
          example: Email
        description:
          type: string
          description: 'Description of how this method works'
          example: 'Receive a verification code via email'
        masked_destination:
          type: string
          description: "Masked destination for email/SMS methods. Shows partial email or phone\nto help users identify which account will receive the code.\nNot present for TOTP, backup code or passkey methods.\n"
          example: 't***@example.com'
    VerificationSessionError:
      type: object
      description: 'Error response for invalid or expired verification session'
      properties:
        message:
          type: string
          example: 'Invalid or expired verification session'
        error_code:
          type: string
          description: "Known values: `INVALID_VERIFICATION_SESSION`, `VERIFICATION_SESSION_EXPIRED`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
          example: INVALID_VERIFICATION_SESSION
    CarJourney:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: car-journeys
        attributes:
          type: object
          properties:
            driver_name:
              type: string
              example: 'John Smith'
            trip_start:
              type: string
              format: date-time
              description: 'ISO-8601 timestamp when the journey started'
              example: '2024-01-15T09:00:00.000000Z'
            trip_end:
              type: string
              format: date-time
              nullable: true
              description: 'ISO-8601 timestamp when the journey ended (null if ongoing)'
              example: '2024-01-15T10:30:00.000000Z'
            is_ongoing:
              type: boolean
              description: 'Whether the journey is still in progress'
              example: false
            duration_minutes:
              type: number
              nullable: true
              description: "Duration of the journey in minutes (null if ongoing). Returned as a float from Carbon's diffInMinutes()."
              example: 90
            comments:
              type: string
              nullable: true
              description: 'Optional comments about the journey'
              example: 'Client meeting in Manchester'
            user:
              type: object
              nullable: true
              description: 'The system user who drove the journey. Null for guest journeys, where the driver is not a user of the system — an agency or relief driver — and only `driver_name` identifies them.'
              properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'John Smith' } }
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T09:00:00.000000Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
        meta:
          type: object
          properties:
            can:
              type: object
              description: 'What the authenticated user may do with this journey. Admins and managers may edit and delete any journey. Anyone else may edit and delete only their own, while it is ongoing or for 12 hours after it ended.'
              properties: { update: { type: boolean, example: true }, delete: { type: boolean, example: true } }
    CarJourneyPaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/car-journeys?page=1'
        last:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/car-journeys?page=3'
        prev:
          type: string
          nullable: true
          example: null
        next:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/car-journeys?page=2'
    CarJourneyValidationError:
      type: object
      properties:
        message:
          type: string
          example: 'The given data was invalid.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            driver_name:
              - 'The driver name field is required.'
            trip_start_date:
              - 'The trip start date field is required.'
    DBSCheck:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: dbs-checks
        attributes:
          type: object
          properties:
            team_id:
              type: integer
              example: 1
            user_id:
              type: integer
              example: 5
            user:
              type: object
              properties: { id: { type: integer, example: 5 }, name: { type: string, example: 'Jane Smith' } }
            date_of_issue:
              type: string
              format: date-time
              nullable: true
              example: '2024-01-15T00:00:00.000000Z'
            certificate_number:
              type: string
              nullable: true
              description: 'Encrypted DBS certificate number'
              example: '12345678'
            certificate:
              type: string
              nullable: true
              description: 'File name of the uploaded certificate'
              example: certificate.pdf
            check_result:
              type: string
              nullable: true
              description: 'Encrypted check result'
              example: Clear
            notes:
              type: string
              nullable: true
              description: 'Reviewer notes. Only returned to privileged users (Admin/Manager); omitted for everyone else.'
              example: 'Annual check completed'
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
        meta:
          $ref: '#/components/schemas/ComplianceRecordMeta'
    RightToWork:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: right-to-work
        attributes:
          type: object
          properties:
            team_id:
              type: integer
              example: 1
            user_id:
              type: integer
              example: 5
            user:
              type: object
              properties: { id: { type: integer, example: 5 }, name: { type: string, example: 'Jane Smith' } }
            primary_document_type:
              type: string
              nullable: true
              description: "Type of primary document\n\nKnown values: `British Passport`, `UK Birth or Adoption Certificate`, `Irish Birth or Adoption Certificate`, `Immigration Papers`, `Immigration Share Code`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: 'British Passport'
            primary_document:
              type: string
              nullable: true
              description: 'File name of the uploaded primary document'
              example: primary.pdf
            supporting_document:
              type: string
              nullable: true
              description: 'File name of the uploaded supporting document'
              example: supporting.pdf
            share_code:
              type: string
              nullable: true
              description: 'Encrypted share code'
              example: ABC123XYZ
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
        meta:
          $ref: '#/components/schemas/ComplianceRecordMeta'
    DriversLicenceCheck:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: drivers-licence-checks
        attributes:
          type: object
          properties:
            team_id:
              type: integer
              example: 1
            user_id:
              type: integer
              example: 5
            user:
              type: object
              properties: { id: { type: integer, example: 5 }, name: { type: string, example: 'Jane Smith' } }
