  /rota/quick-add/parse:
    post:
      operationId: parseQuickAddText
      summary: 'Parse quick-add text'
      description: "Hand a spoken or typed phrase — \"dentist Tuesday half three\" — to the\nparser and receive a token to poll.\n\n**This endpoint creates nothing.** It parses, and that is all. The client\nrenders the result for the user to confirm and then calls\n`POST /rota/appointments` or `POST /rota/shifts` itself. An AI parse must\nnever write to somebody's rota unseen.\n\n## Why two calls\n\nThe provider call regularly takes several seconds — too long to hold a\nclient open, let alone a watch. This returns `202` immediately with a\ntoken; poll `GET /rota/quick-add/parse/{token}` until `status` is no\nlonger `pending`. A second of interval is plenty.\n\n## Notes\n\n- `timezone` matters: \"half three\" names no instant without one. Send the\n  device's IANA zone. Omitted, the platform's own zone is used.\n- The colleague and tag names the parser needs are resolved server-side\n  from the token's team. Clients neither send nor need them.\n- The token belongs to the user who created it and lives for 5 minutes.\n\n**Authorization:** any authenticated team member whose team's plan\nincludes `ai_assistance`; on any other plan this returns `403`.\nCompanion (Apple Watch) tokens carry the `access` ability and may call\nthis.\n\n**Rate limit:** 10 requests per minute; beyond that this returns `429`.\n"
      tags:
        - 'Quick Add'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseQuickAddInput'
            examples:
              appointment: { summary: 'Dictated appointment', value: { text: 'dentist tuesday half three', timezone: Europe/London } }
              shift: { summary: 'Dictated shift', value: { text: 'Sarah 9-5 Monday, tag training', timezone: Europe/London } }
      responses:
        202:
          description: "Accepted for parsing. Poll `GET /rota/quick-add/parse/{token}` with\nthe returned token.\n"
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { token: { type: string, format: uuid, description: 'Poll this token for the outcome.', example: 9b1f2c1e-7c2a-4d1f-9d0f-1f9f3a4b5c6d }, status: { type: string, description: "Always `pending` here — nothing has been parsed yet.\n", example: pending }, expires_in: { type: integer, description: "Seconds the token remains pollable. After this the\ntoken 404s and the text must be submitted again.\n", example: 300 } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: "The team's plan does not include `ai_assistance`, or the token lacks\nthe `access` ability.\n"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples: { plan: { summary: 'Plan does not include AI assistance', value: { message: 'Your plan does not include this feature.' } }, ability: { summary: 'Token lacks the access ability', value: { message: 'Invalid ability provided.' } } }
        422:
          $ref: '#/components/responses/RotaValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  '/rota/quick-add/parse/{token}':
    get:
      operationId: getQuickAddParse
      summary: 'Poll a quick-add parse'
      description: "Read the outcome of a parse. Poll about once a second until `status` is\nno longer `pending`.\n\n## The polling contract\n\n- `pending` — the job hasn't published yet. Keep polling.\n- `completed` — `result` carries the parsed entry. Render it for\n  confirmation; nothing has been created.\n- `failed` — the parser couldn't be reached or couldn't answer. `hint`\n  is a sentence to show the user. This is **not** an error condition:\n  quick add is a convenience over a form, so fall back to the form\n  rather than reporting a failure.\n\nThe result is not consumed by reading it: a client that loses the\nresponse can ask again within the token's 5-minute life. After that, and\nfor a token belonging to anybody else, this returns `404`.\n\n**Authorization:** the user who created the token, and only them. As\nwith `POST /rota/quick-add/parse`, the team's plan must include\n`ai_assistance`; otherwise this returns `403`.\n"
      tags:
        - 'Quick Add'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
        -
          name: token
          in: path
          required: true
          description: 'The token returned by `POST /rota/quick-add/parse`.'
          schema:
            type: string
          example: 9b1f2c1e-7c2a-4d1f-9d0f-1f9f3a4b5c6d
      responses:
        200:
          description: "The current state of the parse. Note that `pending` and `failed` are\nboth `200` responses — neither is an error.\n"
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/QuickAddParseState' } } }
              examples: { pending: { summary: 'Still parsing', value: { data: { status: pending } } }, completed: { summary: "Parsed, awaiting the user's confirmation", value: { data: { status: completed, result: { intent: appointment, title: Dentist, assignee_name: null, assignee_id: null, assignee_candidates: {}, date: '2026-08-18', end_date: null, start_time: '15:30', end_time: null, duration_minutes: 30, location: '12 High Street', is_virtual: false, is_all_day: false, is_sleeping_night: false, is_private: false, tags: {}, notes: null, confidence: 0.95 } } } }, failed: { summary: "The parser couldn't answer", value: { data: { status: failed, hint: "We couldn't read that. Try again, or enter the details yourself." } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: "The team's plan does not include `ai_assistance`, or the token lacks\nthe `access` ability.\n"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'Your plan does not include this feature.' }
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/ServerError'
