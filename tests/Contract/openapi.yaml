              examples: { with_address: { summary: 'User has address', value: { data: { id: '1', type: addresses, attributes: { address_line_one: '123 Main Street', address_line_two: 'Flat 4', address_line_three: null, town: London, county: 'Greater London', postcode: 'SW1A 1AA', created_at: '2023-01-15T10:00:00Z', updated_at: '2023-06-20T14:30:00Z' } } } }, no_address: { summary: 'User has no address', value: { data: null } } }
