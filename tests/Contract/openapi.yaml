          description: 'HH:MM, 24-hour. At or before the start, it falls on the next day.'
          example: '23:00'
        requested_pay_enhancement_id:
          type: integer
          nullable: true
          description: 'A pay enhancement of the team in `X-Team-ID`.'
        reason:
          type: string
          nullable: true
          maxLength: 1000
          example: 'Stayed on to cover the handover'
        requested_tags:
          type: array
          items:
            type: string
          description: 'The rota tags the shift should carry'
          example:
            - Driving
    RotaShiftAmendmentRequest:
      type: object
      properties:
        id:
          type: string
          example: '4'
        type:
          type: string
          example: shift_amendment_requests
        attributes:
          type: object
          properties:
            team_id:
              type: integer
            user_id:
              type: integer
            rota_entry_id:
              type: integer
            proposed_start:
              type: string
              format: date-time
              example: '2026-11-20T15:00:00+00:00'
            proposed_end:
              type: string
              format: date-time
              example: '2026-11-20T23:00:00+00:00'
            requested_pay_enhancement_id:
              type: integer
              nullable: true
            requested_tags:
              type: array
              items: { type: string }
            reason:
              type: string
              nullable: true
            status:
              type: string
              description: "Known values: `Pending`, `Approved`, `Rejected`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: Pending
            reviewed_by:
              type: integer
              nullable: true
            reviewed_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    RotaSleepoverStartOption:
      type: object
      properties:
        time:
          type: string
          description: 'HH:MM, to send as `start_time` when applying'
          example: '20:00'
        label:
          type: string
          example: '8:00 PM'
        compliant:
          type: boolean
          description: 'Whether starting then keeps your Working Time rest within the rules'
          example: true
        reason:
          type: string
          nullable: true
          description: 'Why a non-compliant start breaches the rules; null when compliant'
          example: null
    RotaCalendarFeedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            url:
              type: string
              format: uri
              nullable: true
              example: 'https://suptmgr.test/calendar/0b6f4f9e-3c1a-4b8e-9a2d-6e1f1c2b3d4e.ics'
        meta:
