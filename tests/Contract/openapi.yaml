              required: [duration_type, start_date]
              properties: { contractor_id: { type: integer, description: 'Required from privileged users, refused from contractors', example: 9 }, duration_type: { type: string, enum: ['Whole Days', 'Custom Timings'] }, start_date: { type: string, format: date, description: 'First day off, or the day for `Custom Timings`. Today or later.', example: '2026-11-09' }, end_date: { type: string, format: date, description: 'Last day off. Required for `Whole Days`.', example: '2026-11-11' }, start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Required for `Custom Timings`.', example: '13:00' }, end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Required for `Custom Timings`; after `start_time`.', example: '17:30' }, note: { type: string, maxLength: 1000, nullable: true, example: 'Away at a family wedding' } }
