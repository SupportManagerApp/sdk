              example: { data: [{ id: '1', type: rota_entries, attributes: { team_id: 1, user_id: 5, user: { id: 5, name: 'Jane Smith', avatar: 'https://s3.example.com/avatars/abc.jpg?X-Amz-Expires=600&...' }, start: '2024-03-15T09:00:00+00:00', end: '2024-03-15T17:00:00+00:00', type: 'Contracted Hours', type_label: 'Contracted Hours', duration: 8.0, is_published: true, is_available: false, is_sleeping_night: false, is_overtime: false } }], meta: { team_id: 1, current_page: 1, from: 1, to: 1, per_page: 15, total: 1, last_page: 1 }, links: { first: 'https://suptmgr.test/api/v1/rota/shifts/today?page=1', last: 'https://suptmgr.test/api/v1/rota/shifts/today?page=1', prev: null, next: null } }
