        section:
          type: string
          nullable: true
          enum:
            - fruit_and_veg
            - bakery
            - meat_and_fish
            - dairy_eggs_and_chilled
            - food_cupboard
            - treats_and_snacks
            - drinks
            - frozen
            - health_and_beauty
            - baby_and_toddler
            - household
            - pets
            - home_and_car
          example: dairy_eggs_and_chilled
        notes:
          type: string
          nullable: true
          maxLength: 255
          example: 'The blue Lurpak, 500g'
    Chore:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: chores
        attributes:
          type: object
          properties:
            team_id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Clean kitchen'
            normalized_name:
              type: string
              description: 'The name trimmed and lower-cased. Chores sharing it form a group, which `group` selects in the bulk chore endpoints.'
              example: 'clean kitchen'
            description:
              type: string
              nullable: true
              example: 'Wipe down surfaces and clean appliances'
            category:
              type: object
              nullable: true
              description: "The chore's category, or `null` when it has none."
              properties: { id: { type: integer, example: 1 }, name: { type: string, example: Kitchen }, color: { type: string, nullable: true, example: '#3b82f6' }, icon: { type: string, nullable: true, example: heroicon-o-home } }
            frequency:
              type: string
              description: "How often the chore should be completed\n\nKnown values: `Daily`, `Three Days`, `Weekly`, `Fortnightly`, `Monthly`, `Custom`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: Weekly
            frequency_label:
              type: string
              description: 'Human-readable label for the frequency'
              example: Weekly
            custom_frequency_days:
              type: integer
              nullable: true
              description: 'Number of days between completions when frequency is `Custom`'
              example: null
            last_completed:
              type: string
              format: date
              nullable: true
              description: 'Date the chore was last completed (null if never completed)'
              example: '2024-01-14'
            snoozed_until:
              type: string
              format: date
              nullable: true
              description: 'Date the chore is snoozed until, or `null` if not snoozed'
              example: null
            is_snoozed:
              type: boolean
              description: 'Whether the chore is currently snoozed (snoozed_until is in the future)'
              example: false
            snoozed_at:
              type: string
              format: date
              nullable: true
              description: 'Date the chore was last snoozed (null if never snoozed)'
              example: null
            snoozed_by:
              type: object
              nullable: true
              description: "The user who last snoozed the chore. Only included when the relation is loaded.\nMay be omitted from the response when not loaded.\n"
              properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'John Doe' } }
            days_since_completion:
              type: integer
              nullable: true
              description: 'Number of days since the chore was last completed (null if never completed)'
              example: 3
            is_overdue:
              type: boolean
              description: 'Whether the chore is currently overdue'
              example: false
            should_highlight:
              type: boolean
              description: 'Whether the chore should be highlighted in the UI (due soon or overdue)'
              example: false
            completed_by:
              type: object
              nullable: true
              description: "The user who last completed the chore. Only included when the relation is loaded.\nMay be omitted from the response when not loaded.\n"
              properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'John Doe' } }
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
        meta:
          type: object
          properties:
            can:
              type: object
              description: 'What the authenticated user may do with this chore. Editing and deleting are limited to admins and managers.'
              properties: { update: { type: boolean, example: false }, delete: { type: boolean, example: false } }
