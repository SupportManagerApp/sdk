  '/rota/shift-blocks/{id}/application':
    post:
      operationId: applyForSleepover
      summary: 'Apply for a sleepover as a whole'
      description: "Apply for every available segment of a sleepover (evening, sleeping\nnight, morning) at once. Every segment must be open to you, or nothing\nis applied for. The applications share an application group and are\napproved and withdrawn together.\n\nSend `start_time` to start later than the sleepover's natural start —\none of the start options or a custom time. The evening is trimmed to\nit; the sleeping night and morning are unchanged.\n\n**Authorization:** shift workers (Manager, PA, Contractor) only, for a\nsleepover with at least one segment open for application. Anybody else\ngets a 403. Needs a token with the `access` ability. Eligibility\nfailures (already applied, Working Time rest, young worker limits, a\nstart outside the sleepover) return a 422 with the reason in `message`.\n"
      tags:
        - 'Shift Applications'
      security:
        -
          sanctum: {}
      parameters:
        -
          name: id
          in: path
          required: true
          description: 'Shift block (sleepover) ID'
          schema:
            type: integer
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { start_time: { type: string, nullable: true, pattern: '^\d{2}:\d{2}$', description: "Later start (HH:MM). Omit to start at the sleepover's natural start.", example: '20:00' } }
      responses:
        201:
          description: 'Applications submitted, one per segment applied for'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ShiftApplication' } }, message: { type: string, example: 'Your application for the sleepover (3 parts) has been submitted for review.' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
