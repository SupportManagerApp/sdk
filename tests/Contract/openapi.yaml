          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/RotaEntryWithApplications' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { $ref: '#/components/schemas/RotaPaginationLinks' } } }
              example: { data: [{ id: '10', type: rota_entries, attributes: { team_id: 1, user_id: null, user: null, start: '2024-03-20T09:00:00+00:00', end: '2024-03-20T17:00:00+00:00', type: 'Contracted Hours', type_label: 'Contracted Hours', duration: 8.0, is_published: true, is_available: true, is_sleeping_night: false, is_overtime: false, shift_applications_count: 2 } }], meta: { team_id: 1, current_page: 1, from: 1, to: 1, per_page: 15, total: 1, last_page: 1 }, links: { first: 'https://suptmgr.test/api/v1/rota/shifts/available?page=1', last: 'https://suptmgr.test/api/v1/rota/shifts/available?page=1', prev: null, next: null } }
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
