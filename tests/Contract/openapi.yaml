          type: string
          format: date
          description: 'Date of the work anniversary this year (YYYY-MM-DD)'
          example: '2025-06-15'
        user_id:
          type: integer
          description: 'ID of the user celebrating the anniversary'
          example: 7
        user_name:
          type: string
          description: 'Display name of the user'
          example: 'John Doe'
        years:
          type: integer
          description: 'Number of full years of service being celebrated'
          example: 5
    Appointment:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: appointments
        attributes:
          type: object
          properties:
            team_id:
              type: integer
              example: 1
            title:
              type: string
              example: Dentist
            location:
              type: string
              nullable: true
              example: '10 Downing Street, London'
            notes:
              type: string
              nullable: true
              example: 'Arrive 15 minutes early. Bring a list of current medication.'
            is_virtual:
              type: boolean
              example: false
            is_all_day:
              type: boolean
              example: false
            is_private:
              type: boolean
              description: "Whether the appointment is restricted to its creator, its named\nviewers, and privileged users.\n"
              example: false
            created_by:
              type: integer
              nullable: true
              description: 'ID of the user who created the appointment'
              example: 5
            viewer_ids:
              type: array
              items: { type: integer }
              description: "IDs of the users named as viewers of a private appointment;\nempty for a public one. Colleagues to name come from\n`GET /users/options`.\n"
              example: [8]
            start:
              type: string
              format: date-time
              example: '2024-03-15T14:00:00+00:00'
            end:
              type: string
              format: date-time
              example: '2024-03-15T14:30:00+00:00'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        meta:
          type: object
          properties:
            can:
              type: object
              properties: { update: { type: boolean, description: 'Whether `PATCH /rota/appointments/{appointment}` is open to you' }, delete: { type: boolean, description: 'Whether `DELETE /rota/appointments/{appointment}` is open to you' } }
    RotaEntry:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: rota_entries
        attributes:
          type: object
          properties:
            team_id:
              type: integer
              example: 1
            user_id:
              type: integer
              nullable: true
              example: 5
            user:
              type: object
              nullable: true
              properties: { id: { type: integer, example: 5 }, name: { type: string, example: 'Jane Smith' }, avatar: { type: string, description: "Avatar URL. Either a short-lived (10 minute) temporary S3 URL when the user\nhas uploaded an avatar, or a generated ui-avatars.com fallback otherwise.\n", example: 'https://s3.example.com/avatars/abc.jpg?X-Amz-Expires=600&...' } }
            start:
              type: string
              format: date-time
              description: "When the shift starts, with the UTC offset in force on that\ndate where the team works. Do not assume UTC.\n"
              example: '2024-03-15T09:00:00+00:00'
            end:
              type: string
              format: date-time
              description: "When the shift ends, with the UTC offset in force on that date.\nOn a shift running across a daylight-saving change this offset\ndiffers from `start`'s — use `duration` for hours worked rather\nthan subtracting the two.\n"
              example: '2024-03-15T17:00:00+00:00'
            type:
              type: string
              description: "Entry type discriminator. Shift types and holiday types are both returned;\nuse this field to render them differently (e.g. shade leave blocks green).\n\nKnown values: `Contracted Hours`, `Overtime Hours`, `Contracted Sleeping Night`, `Overtime Sleeping Night`, `Annual Leave Hours`, `Annual Leave Sleeping Night`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: 'Contracted Hours'
            type_label:
              type: string
              example: 'Contracted Hours'
            duration:
              type: number
              format: float
              description: 'Duration in hours'
              example: 8.0
            is_published:
              type: boolean
              example: true
            is_available:
              type: boolean
              example: false
            is_sleeping_night:
              type: boolean
              example: false
            is_overtime:
              type: boolean
              example: false
            is_for_toil:
              type: boolean
              description: 'Whether the hours are banked as time off in lieu rather than paid'
              example: false
            is_private:
              type: boolean
              description: 'Whether only its worker and privileged users can see it'
              example: false
            shift_block_id:
              type: integer
              nullable: true
              description: "The sleepover this entry is a segment of. A sleepover is applied\nfor and withdrawn as a whole through `/rota/shift-blocks/{id}/application`.\n"
              example: null
            tags:
              type: array
              items: { type: string }
              description: "The entry's rota tags"
              example: [Driving]
            own_application_status:
              type: string
              nullable: true
              description: "The status of your own application for this entry, or null when you\nhave not applied. Known values: `Pending`, `Approved`, `Rejected`.\n"
              example: null
            pay_enhancement:
              type: object
              nullable: true
              properties: { id: { type: integer }, name: { type: string }, factor: { type: string, description: "Pay enhancement factor as a string-cased decimal\n\nKnown values: `0.25`, `0.50`, `0.75`, `1`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n", example: '0.50' }, is_private: { type: boolean, example: false } }
            notes:
              type: string
              nullable: true
              example: 'Cover for Jane'
            created_at:
              type: string
              format: date-time
              example: '2024-03-15T10:00:00.000000Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-03-15T10:00:00.000000Z'
        meta:
          type: object
          properties:
            can:
              type: object
              properties: { apply: { type: boolean, description: "Whether you may apply for this entry — for a sleepover segment,\nfor its sleepover through the shift-block endpoint. The Working\nTime rest check runs when you apply.\n" }, request_amendment: { type: boolean, description: 'Whether `POST /rota/shifts/{id}/amendment-requests` is open to you' } }
            cannot_apply_reason:
              type: string
              nullable: true
              description: 'Why you cannot apply, when `can.apply` is false; null otherwise'
              example: 'You have already applied for this shift.'
    RotaEntryWithApplications:
      allOf:
        -
          $ref: '#/components/schemas/RotaEntry'
        -
          type: object
          properties:
            attributes:
              type: object
              properties: { shift_applications_count: { type: integer, description: 'Number of applications (privileged users only)', example: 3 } }
    RotaPaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/rota/shifts/today?page=1'
        last:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/rota/shifts/today?page=3'
        prev:
          type: string
          nullable: true
          example: null
        next:
          type: string
          nullable: true
          example: 'https://suptmgr.test/api/v1/rota/shifts/today?page=2'
    ShiftApplication:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: shift-applications
        attributes:
          type: object
          properties:
            team_id:
              type: integer
              example: 1
            status:
              type: string
              description: "Known values: `Pending`, `Approved`, `Rejected`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: Pending
            start_time:
              type: string
              pattern: '^[0-2][0-9]:[0-5][0-9]$'
              description: 'HH:MM format'
              example: '09:00'
            end_time:
              type: string
              pattern: '^[0-2][0-9]:[0-5][0-9]$'
              description: 'HH:MM format'
              example: '17:00'
            user:
              type: object
              properties: { id: { type: integer }, name: { type: string } }
            rota_entry:
              $ref: '#/components/schemas/RotaEntry'
            reviewed_by:
              type: integer
              nullable: true
              description: 'User ID of the reviewer (omitted until reviewed)'
              example: null
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ApplyForShiftRequest:
      type: object
      properties:
        is_split_application:
          type: boolean
          default: false
          description: 'Whether this is a partial/split shift application'
        proposed_start_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: 'Required if is_split_application is true (HH:MM format)'
          example: '09:00'
        proposed_end_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: 'Required if is_split_application is true (HH:MM format)'
          example: '13:00'
    SigningRequest:
      type: object
      properties:
        id:
          type: string
          example: '12'
        type:
          type: string
          example: signature-requests
        attributes:
          type: object
          properties:
            document:
              type: object
              properties: { name: { type: string }, status: { type: string, description: 'Known values: `sent`, `completed`, `voided`.' }, sent_at: { type: string, format: date-time, nullable: true }, completed_at: { type: string, format: date-time, nullable: true } }
            name:
              type: string
              description: "The recipient's name as it appears on the document"
            email:
              type: string
            role:
              type: string
              nullable: true
              description: 'The part the recipient plays in the document, such as "Tenant", if the sender gave one'
            sent_at:
              type: string
              format: date-time
              nullable: true
            viewed_at:
              type: string
              format: date-time
              nullable: true
              description: 'When the recipient first opened the document'
            signed_at:
              type: string
              format: date-time
              nullable: true
            signed_via:
              type: string
              nullable: true
              description: 'Where the recipient signed. Known values: `web`, `app`.'
        meta:
          type: object
          properties:
            can:
              type: object
              properties: { sign: { type: boolean, description: 'Whether the user can save values and sign' }, download_signed: { type: boolean, description: 'Whether a signed copy can be downloaded' } }
    SigningRequestWithFields:
      allOf:
        -
          $ref: '#/components/schemas/SigningRequest'
        -
          type: object
          properties:
            attributes:
              type: object
              properties: { fields: { type: array, description: "The recipient's own fields, plus fields other people have filled in once they have signed.\nPositions and sizes are fractions of the page's width and height, measured from its top left.\n", items: { $ref: '#/components/schemas/SigningField' } }, consent_statement: { type: string, description: 'The exact statement the recipient agrees to by signing' } }
    SigningField:
      type: object
      properties:
        id:
          type: string
          description: "Key for this field's value when saving"
        type:
          type: string
          description: 'Known values: `text`, `name`, `email`, `phone`, `number`, `signature`, `initials`, `date`, `checkbox`.'
        is_mine:
          type: boolean
          description: 'Whether the recipient fills in this field'
        is_required:
          type: boolean
          description: 'Whether the field must be filled in before signing. Checkboxes are optional.'
        page:
          type: integer
          description: 'Page number, starting at 1'
        x:
          type: number
        'y':
          type: number
        width:
          type: number
        height:
          type: number
        value:
          type: string
          nullable: true
    SigningValidationErrors:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SigningError:
      type: object
      properties:
        message:
          type: string
    Task:
      type: object
      properties:
        key:
          type: string
          description: 'Unique task identifier using dot notation'
          example: profile.address
        label:
          type: string
          description: 'Human-readable task name'
          example: 'Home Address'
        description:
          type: string
          description: 'What needs to be done'
          example: 'Provide your current home address for correspondence and tax purposes'
        icon:
          type: string
          description: 'Heroicon name for UI display'
          example: home
        completed:
          type: boolean
          description: 'Whether the task is complete'
          example: false
        completion_role:
          type: string
          description: "Who can complete the task\n\nKnown values: `self`, `manager`, `both`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
          example: both
        completion_role_label:
          type: string
          description: 'Human-readable completion role'
          example: 'Employee or Manager'
        priority:
          type: integer
          description: 'Sort order (lower values appear first)'
          example: 100
    TaskCount:
      type: object
      properties:
        count:
          type: integer
          description: 'Total incomplete tasks (my_tasks + manager_inbox)'
          example: 5
        my_tasks:
          type: integer
          description: "User's own incomplete tasks"
          example: 3
        manager_inbox:
          type: integer
          description: 'Pending manager-only tasks (0 for non-privileged users)'
          example: 2
    TaskProgress:
      type: object
      properties:
        percentage:
          type: integer
          description: 'Completion percentage (0-100)'
          minimum: 0
          maximum: 100
          example: 75
        completed:
          type: integer
          description: 'Number of completed tasks'
          example: 3
        total:
          type: integer
          description: 'Total number of visible tasks'
          example: 4
    EmployeePendingTasks:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
              example: 5
            name:
              type: string
              example: 'Jane Smith'
        pending_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    EmployeeTaskProgress:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
              example: 5
            name:
              type: string
              example: 'Jane Smith'
        percentage:
          type: integer
          description: 'Completion percentage (0-100)'
          example: 75
        incomplete_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    Team:
