  /household/shopping-list:
    get:
      operationId: getShoppingListItems
      summary: 'List shopping list items'
      description: "Retrieve a paginated list of shopping list items for the authenticated user's team.\n\nSupports filtering by name (partial match), needs_purchasing status, requesting user (exact match),\nand items bought today.\nResults are sorted by created_at descending by default.\n"
      tags:
        - 'Shopping List'
      security:
        -
          sanctum: {}
      parameters:
        -
          name: X-Team-ID
          in: header
          description: 'Team ID for tenant context'
          required: true
          schema:
            type: integer
          example: 1
        -
          name: page
          in: query
          description: 'Page number for pagination'
          schema:
            type: integer
            minimum: 1
          example: 1
        -
          name: per_page
          in: query
          description: 'Number of items per page'
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 15
        -
          name: 'filter[name]'
          in: query
          description: 'Filter by item name (partial match)'
          schema:
            type: string
          example: milk
        -
          name: 'filter[needs_purchasing]'
          in: query
          description: 'Filter by purchasing status'
          schema:
            type: boolean
          example: true
        -
          name: 'filter[requested_by_id]'
          in: query
          description: 'Filter by the ID of the user who requested the item (exact match)'
          schema:
            type: integer
          example: 5
        -
          name: 'filter[purchased_today]'
          in: query
          description: 'When true, return only items ticked off as purchased today, matching the web list''s "Bought today" section. `false` applies no filter.'
          schema:
            type: boolean
          example: true
        -
          name: sort
          in: query
          description: 'Sort field (prefix with - for descending)'
          schema:
            type: string
            enum:
              - name
              - created_at
              - last_purchased_on
              - needs_purchasing
              - '-name'
              - '-created_at'
              - '-last_purchased_on'
              - '-needs_purchasing'
          example: '-created_at'
      responses:
        200:
          description: 'Shopping list items retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ShoppingListItem' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { $ref: '#/components/schemas/HouseholdPaginationLinks' } } }
              example: { data: [{ id: '1', type: shopping-list-items, attributes: { name: Milk, quantity: 2, needs_purchasing: true, is_maybe: false, last_purchased_on: null, requested_by: { id: 1, name: 'John Doe' }, created_at: '2024-01-15T10:30:00.000000Z', updated_at: '2024-01-15T10:30:00.000000Z' } }], meta: { team_id: 1, current_page: 1, from: 1, to: 1, per_page: 15, total: 1, last_page: 1 }, links: { first: 'https://suptmgr.test/api/v1/household/shopping-list?page=1', last: 'https://suptmgr.test/api/v1/household/shopping-list?page=1', prev: null, next: null } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createShoppingListItem
      summary: 'Add a shopping list item (match or create)'
      description: "Add an item to the authenticated user's team shopping list.\n\nThe name is first matched against items the team already has, so that a\ndictated or retyped addition does not create a duplicate. Matching is\ndeterministic — no AI — and runs in this order:\n\n1. Equal after normalising (trim, casefold, strip punctuation, collapse\n   inner whitespace).\n2. Equal after also removing a trailing plural \"s\" from both sides, so\n   `bin bag` matches an existing `Bin bags`.\n3. Within a small edit distance (1 for names of 5+ characters, 2 for\n   8+), which catches misheard dictation such as `kitchen role`.\n\nWhere several items match, the one already needing purchase wins, then\nthe most recently updated. Matching is always scoped to the team.\n\n`meta.outcome` says what happened:\n\n- `created` — nothing matched, a new item was added (`201`).\n- `reactivated` — a matched item had `needs_purchasing: false` and has\n  been flipped back on (`200`). Its `last_purchased_on` is preserved.\n- `already_needed` — a matched item already needed purchasing, nothing\n  changed (`200`).\n\n`meta.matched_name` is the canonical name already on the list, so a\nclient can show the spelling it landed on rather than correcting the\nspeaker silently. It is `null` when `outcome` is `created`.\n\nPass `force=true` to skip matching entirely and always create a new item.\nThe authenticated user is recorded as the requester.\n"
      tags:
        - 'Shopping List'
      security:
        -
          sanctum: {}
      parameters:
        -
          name: X-Team-ID
          in: header
          description: 'Team ID for tenant context'
          required: true
          schema:
            type: integer
          example: 1
        -
          name: force
          in: query
          description: 'Skip matching and always create a new item.'
          required: false
          schema:
            type: boolean
            default: false
          example: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 255, description: 'Name of the item', example: Milk }, quantity: { type: integer, minimum: 1, maximum: 999, description: 'Quantity of the item (optional, defaults to 1)', example: 2 }, needs_purchasing: { type: boolean, description: 'Whether the item still needs to be purchased', example: true }, is_maybe: { type: boolean, description: 'Whether the item is a "maybe" / nice-to-have', example: false }, section: { type: string, nullable: true, enum: [fruit_and_veg, bakery, meat_and_fish, dairy_eggs_and_chilled, food_cupboard, treats_and_snacks, drinks, frozen, health_and_beauty, baby_and_toddler, household, pets, home_and_car], description: 'The shop section the item is found in', example: dairy_eggs_and_chilled }, notes: { type: string, nullable: true, maxLength: 255, description: 'Brand, size or other notes for whoever is buying it', example: 'The blue Lurpak, 500g' }, force: { type: boolean, description: 'Skip matching and always create a new item', default: false, example: false } }
            example:
              name: Milk
              quantity: 2
              needs_purchasing: true
              is_maybe: false
      responses:
        200:
          description: "An existing item matched. It was either reactivated\n(`outcome: reactivated`) or already needed purchasing\n(`outcome: already_needed`); no new item was added.\n"
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShoppingListItem' }, meta: { $ref: '#/components/schemas/ShoppingListAddMeta' } } }
              example: { data: { id: '7', type: shopping-list-items, attributes: { name: 'Kitchen roll', quantity: 1, needs_purchasing: true, is_maybe: false, last_purchased_on: '2026-08-04' } }, meta: { team_id: 1, outcome: reactivated, matched_name: 'Kitchen roll' } }
        201:
          description: 'No item matched, so a new one was created (`outcome: created`).'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShoppingListItem' }, meta: { $ref: '#/components/schemas/ShoppingListAddMeta' } } }
              example: { data: { id: '8', type: shopping-list-items, attributes: { name: 'Kitchen roll', quantity: 1, needs_purchasing: true, is_maybe: false, last_purchased_on: null } }, meta: { team_id: 1, outcome: created, matched_name: null } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/HouseholdValidationError'
        500:
          $ref: '#/components/responses/ServerError'
