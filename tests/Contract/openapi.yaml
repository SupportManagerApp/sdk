      tags:
        - Appointments
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentInput'
            examples:
              timed: { summary: 'A confirmed quick-add parse', value: { title: Dentist, date: '2026-08-18', start_time: '15:30', end_time: '16:00', location: '12 High Street' } }
              all_day: { summary: 'Multi-day all-day event', value: { title: 'Holiday in France', date: '2026-08-12', end_date: '2026-08-19', is_all_day: true } }
      responses:
