  /rota/shifts:
    post:
      operationId: createShift
      summary: 'Create a shift'
      description: "Create a rota entry — where a confirmed quick-add parse of a shift lands.\n\nThe entry is created as overtime (`overtime_sleeping_night` when\n`is_sleeping_night` is set, `overtime_hours` otherwise), published, and\nnot marked available, matching what the web quick-add modal creates.\n\n- `end_time` may be omitted; an hour after `start_time` is assumed, as on\n  the web.\n- An `end_time` at or before `start_time` is read as an overnight shift\n  and rolls into the next day (\"10pm to 7am\").\n- `assignee_id` must be a member of the team in `X-Team-ID`.\n\n**Authorization:** privileged users (Admin/Manager) only, as on the web.\nCompanion (Apple Watch) tokens of such a user may call this.\n"
      tags:
        - Shifts
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftInput'
            examples:
              from_parse: { summary: 'A confirmed quick-add parse', value: { assignee_id: 12, date: '2026-08-17', start_time: '09:00', end_time: '17:00', tags: [training], notes: 'covering for Jane' } }
              sleeping_night: { summary: 'Overnight sleeping night', value: { assignee_id: 12, date: '2026-08-17', start_time: '22:00', end_time: '07:00', is_sleeping_night: true, is_private: true } }
      responses:
        201:
          description: 'Shift created'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/RotaEntry' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/RotaValidationError'
        500:
          $ref: '#/components/responses/ServerError'
    get:
      operationId: getShifts
      summary: 'List shifts for a date range'
      description: "Retrieve a paginated list of published shifts and leave blocks for a date range.\nMirrors the web weekly view, which includes both shift types and holiday types\n(annual leave) so mobile clients can render leave blocks alongside regular shifts.\nUse the `type` field in each entry to distinguish a shift from a holiday entry.\n\n**Authorization:**\n- Non-privileged users in `team` mode (default) see the whole team — same as the web\n- `scheduled` mode constrains results to the authenticated user's own entries\n- Privileged users (Admin/Manager) can additionally filter by `user_id`\n\nExcludes unpublished entries.\n"
      tags:
        - Shifts
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/PerPage'
        -
          name: 'filter[start_date]'
          in: query
          required: true
          description: 'Filter shifts starting on or after this date (YYYY-MM-DD)'
          schema:
            type: string
            format: date
          example: '2024-03-01'
        -
          name: 'filter[end_date]'
          in: query
          required: true
          description: 'Filter shifts starting on or before this date (YYYY-MM-DD)'
          schema:
            type: string
            format: date
          example: '2024-03-31'
        -
          name: 'filter[user_id]'
          in: query
          description: 'Filter by user ID (privileged users only)'
          schema:
            type: integer
          example: 5
        -
          name: 'filter[mode]'
          in: query
          description: "Schedule view mode. Defaults to `team` when omitted.\n\n- `team` — all published entries for the team, for all user roles (default; mirrors web)\n- `scheduled` — only the authenticated user's own entries\n- `available` — entries open for application or with nobody assigned\n  yet, as on the web calendar's available view\n\nNon-privileged users see the full team in `team` mode, matching the web weekly view.\n`scheduled` always constrains to the authenticated user regardless of role.\n"
          schema:
            type: string
            enum:
              - team
              - scheduled
              - available
          example: scheduled
        -
          name: sort
          in: query
          description: 'Sort field (prefix with - for descending)'
          schema:
            type: string
            enum:
              - start
              - end
              - '-start'
              - '-end'
          example: start
      responses:
        200:
          description: 'Shifts retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/RotaEntry' } }, meta: { allOf: [{ $ref: '#/components/schemas/PaginationMeta' }, { type: object, properties: { rota_week: { type: integer, description: "The team's rota week number for the requested week (1-based).\nDerived from `filter[start_date]` (rounded to the start of the\nISO week); falls back to the current week when `filter[start_date]`\nis omitted. Use together with `rota_week_count` to render\n\"Week X of Y\" labels.\n", example: 2 }, rota_week_count: { type: integer, nullable: true, description: "The total number of weeks in the team's rota cycle (e.g. a 4-week\nrolling pattern returns 4). Null when there is no tenant context.\n", example: 4 } } }] }, links: { $ref: '#/components/schemas/RotaPaginationLinks' } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
  /rota/shifts/available:
    get:
      operationId: getAvailableShifts
      summary: 'List available shifts'
      description: "Retrieve a paginated list of available unassigned shifts for the team.\n\n**Authorization:** All authenticated team members can view available shifts.\n\nOnly returns shifts that are:\n- Published\n- Marked as available\n- Not assigned to a user\n- In the future (start time >= now)\n- Not private, unless the caller is privileged (Admin/Manager) or a\n  family member, as on the web calendar\n\n**Privileged users** (Admin/Manager) will see application counts for each shift.\n"
      tags:
