  responses:
    UnauthorizedError:
      description: 'Authentication token is missing or invalid'
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Unauthenticated. }
    Unauthorized:
      description: 'Authentication required'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    Forbidden:
      description: 'Access denied'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'This action is unauthorized.'
    NotFound:
      description: 'Resource not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'No query results for model.'
    InvalidTeam:
      description: 'Invalid or missing team context'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Invalid or missing team. Please specify a valid team ID via X-Team-ID header or team_id parameter.'
    ValidationError:
      description: 'Validation failed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequestsError:
      description: "Rate limit exceeded. The request was rejected without being processed.\n\nClients should surface the wait to the user rather than retrying\nimmediately — further attempts inside the window are also rejected and\nkeep the limiter saturated. Use the `Retry-After` header to determine\nhow long to wait.\n"
      headers:
        Retry-After:
          description: 'Seconds to wait before the next attempt will be accepted.'
          schema:
            type: integer
            example: 60
        X-RateLimit-Limit:
          description: 'Maximum number of requests allowed within the window.'
          schema:
            type: integer
            example: 5
        X-RateLimit-Remaining:
          description: 'Requests remaining in the current window. Always `0` on a 429.'
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          description: 'Unix timestamp at which the current window resets.'
          schema:
            type: integer
            example: 1754899200
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: 'Too Many Attempts.' }
    ServerError:
      description: 'Internal server error'
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: 'Internal server error' }
    AccidentsForbidden:
      description: "The user may not use the accident book (family members, contractors and\nformer personal assistants), or may not view this report.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccidentError'
          example:
            message: 'This action is unauthorized.'
    AccidentsNotFound:
      description: "The team has not switched on the accident book, or the report does not\nexist in the current team.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccidentError'
          example:
            message: 'Not Found'
    DevLoginUnavailable:
      description: "Developer login is not available on this environment, so the route does\nnot exist. Indistinguishable from any other unknown path, which is\ndeliberate: the endpoints are absent rather than present-and-refusing.\n"
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: '' }
    CarJourneyForbidden:
      description: "Access denied, either because the user may not change this journey or\nbecause a shift worker is outside their shift window.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notAllowed:
              summary: 'The user may not change this journey'
              value: { message: 'This action is unauthorized.' }
            outsideShiftWindow:
              summary: 'A shift worker is outside their shift window'
              value: { message: 'The Home tab is available from an hour before your shift starts until an hour after it ends.' }
    OutsideShiftWindow:
      description: "Personal assistants, managers and contractors can only use car journeys\nfrom an hour before one of their published shifts starts until an hour\nafter it ends.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'The Home tab is available from an hour before your shift starts until an hour after it ends.'
    CarJourneyValidationError:
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CarJourneyValidationError'
    ComplianceDBSCheckSaved:
      description: 'The DBS check was saved. 201 when it was created, 200 when an existing one was replaced.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/DBSCheck' }
              meta: { type: object, properties: { team_id: { type: integer } } }
    ComplianceRightToWorkSaved:
      description: 'The right-to-work record was saved. 201 when it was created, 200 when an existing one was replaced.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/RightToWork' }
              meta: { type: object, properties: { team_id: { type: integer } } }
    ComplianceDriversLicenceCheckSaved:
      description: 'The drivers licence check was saved. 201 when it was created, 200 when an existing one was replaced.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/DriversLicenceCheck' }
              meta: { type: object, properties: { team_id: { type: integer } } }
    ComplianceDocumentDownload:
      description: 'Download URL generated successfully'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, properties: { download_url: { type: string, format: uri, description: 'Temporary signed URL for downloading the document' }, filename: { type: string, description: 'File name of the document' }, expires_at: { type: string, format: date-time, description: 'When the download URL expires' } } }
          example:
            data:
              download_url: 'https://bucket.s3.amazonaws.com/dbs-checks/1/5/certificate.pdf?X-Amz-Expires=300&X-Amz-Signature=...'
              filename: certificate.pdf
              expires_at: '2024-03-15T14:35:00.000000Z'
    ComplianceValidationError:
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ComplianceValidationError'
    HolidayValidationError:
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HolidayValidationError'
    HouseholdValidationError:
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HouseholdValidationError'
    NotificationNotFound:
      description: "The notification does not exist for the authenticated user. Returned\nas plain JSON with only a `message` field (no `success` key).\n"
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: 'Notification not found.' }
          examples:
            not_found:
              summary: 'Notification not found'
              value: { message: 'Notification not found.' }
    PushNotificationValidationError:
      description: 'Validation failed'
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: 'The given data was invalid.' }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
          examples:
            missing_token:
              summary: 'Missing token field'
              value: { message: 'The given data was invalid.', errors: { token: ['The token field is required.'] } }
            missing_platform:
              summary: 'Missing platform field'
              value: { message: 'The given data was invalid.', errors: { platform: ['The platform field is required.'] } }
            invalid_platform:
              summary: 'Invalid platform value'
              value: { message: 'The given data was invalid.', errors: { platform: ['The selected platform is invalid.'] } }
    RotaValidationError:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: 'The given data was invalid.' }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
          example:
            message: 'The given data was invalid.'
            errors:
              type: ['The type field is required.']
    SigningUnauthorized:
      description: 'Authentication required'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SigningError'
          example:
            message: Unauthenticated.
    SigningForbidden:
      description: 'Access denied'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SigningError'
          example:
            message: 'This action is unauthorized.'
    SigningNotFound:
      description: 'Not found, or E-signing is not available to the team'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SigningError'
          example:
            message: 'Not Found'
    SigningValidationFailed:
      description: 'Validation failed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SigningValidationErrors'
    UserValidationError:
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserValidationError'
security:
  -
    sanctum: {}
paths:
  /accidents:
    get:
      operationId: getAccidentReports
      summary: 'List accident reports'
      description: "Retrieve a paginated list of accident reports, newest accident first.\n\nAdmins and managers see every report in the team. Personal assistants\nsee the reports they recorded and the reports about accidents that\nhappened to them. Family members, contractors and former personal\nassistants get a 403.\n\nRequires the team to have switched on the accident book; otherwise the\nendpoint returns 404.\n"
      tags:
        - 'Accident Book'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/AccidentsTeamId'
        -
          name: page
          in: query
          description: 'Page number for pagination'
          schema:
            type: integer
            minimum: 1
          example: 1
        -
          name: per_page
          in: query
          description: 'Number of reports per page. Values above 100 are capped at 100.'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
          example: 15
        -
          name: sort
          in: query
          description: 'Sort field (prefix with - for descending). Defaults to -happened_at.'
          schema:
            type: string
            enum:
              - happened_at
              - report_number
              - '-happened_at'
              - '-report_number'
          example: '-happened_at'
      responses:
        200:
          description: 'Accident reports retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AccidentReport' } }, meta: { $ref: '#/components/schemas/AccidentPaginationMeta' }, links: { $ref: '#/components/schemas/AccidentPaginationLinks' } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/AccidentsForbidden'
        404:
          $ref: '#/components/responses/AccidentsNotFound'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createAccidentReport
      summary: 'Record an accident'
      description: "Record an accident in the accident book, matching the web app's\n\"Record an accident\" form. Admins, managers and personal assistants may\nrecord accidents; everyone else gets a 403.\n\nThe `subject` describes who had the accident:\n\n- `me`: the authenticated user. Their name is used as the subject's\n  name, and `reporter_declared_name` doubles as the subject's\n  declaration, so `subject_declared_name` is ignored.\n- `team_member`: another member of the current team, given by\n  `subject.user_id`. Their name is taken from their account, so\n  `subject.name` is ignored. Use `GET /users/options` to list the team\n  members to choose from.\n- `other`: someone outside the team, given by `subject.name` and the\n  `subject.capacity` they were there in.\n\nFor `team_member` and `other`, the injured person can confirm the report\nstraight away with `subject_declared_name`, or later through\n`POST /accidents/{accidentReport}/subject-declaration`.\n\n`happened_at` is an ISO 8601 date-time. Send it with a UTC offset; a\nvalue without an offset is read as UK local time. It must not be in the\nfuture.\n\nAdmins and managers are notified about the new report.\n"
      tags:
        - 'Accident Book'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/AccidentsTeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccidentReportCreate'
            examples:
              me: { summary: 'The reporter had the accident', value: { subject: { type: me }, happened_at: '2026-10-30T14:15:00+00:00', location: Kitchen, how_it_happened: 'Slipped on a wet floor while carrying the shopping in.', cause: 'Spilt water by the sink', injury_details: 'Bruised left knee', reporter_declared_name: 'Sam Carer' } }
              teamMember: { summary: 'Another team member had the accident', value: { subject: { type: team_member, user_id: 12 }, happened_at: '2026-10-30T14:15:00+00:00', location: Garden, how_it_happened: 'Tripped over a hose pipe.', reporter_declared_name: 'Sam Carer' } }
              someoneElse: { summary: 'A visitor had the accident', value: { subject: { type: other, name: 'Alex Visitor', capacity: Visitor }, happened_at: '2026-10-30T14:15:00+00:00', location: 'Front steps', how_it_happened: 'Missed the bottom step on the way in.', reporter_declared_name: 'Sam Carer', subject_declared_name: 'Alex Visitor' } }
      responses:
        201:
          description: 'Accident recorded'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/AccidentReport' }, meta: { $ref: '#/components/schemas/AccidentTeamMeta' } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/AccidentsForbidden'
        404:
          $ref: '#/components/responses/AccidentsNotFound'
        422:
          description: "Validation failed. `subject.user_id` must be a member of the current\nteam.\n"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccidentValidationError' }
              example: { message: 'The selected subject.user id is invalid.', errors: { subject.user_id: ['The selected subject.user id is invalid.'] } }
        500:
          $ref: '#/components/responses/ServerError'
  '/accidents/{accidentReport}':
    get:
      operationId: getAccidentReport
      summary: 'Get an accident report'
      description: "Retrieve a single accident report. Admins and managers can view any\nreport in the team; personal assistants can view the reports they\nrecorded or that are about them, and get a 403 for any other.\n\nThe `riddor` attribute is only included for admins and managers.\n"
      tags:
        - 'Accident Book'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/AccidentsTeamId'
        -
          $ref: '#/components/parameters/AccidentReportId'
      responses:
        200:
          description: 'Accident report retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/AccidentReport' }, meta: { $ref: '#/components/schemas/AccidentTeamMeta' } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/AccidentsForbidden'
        404:
          $ref: '#/components/responses/AccidentsNotFound'
        500:
          $ref: '#/components/responses/ServerError'
  '/accidents/{accidentReport}/subject-declaration':
    post:
      operationId: recordAccidentSubjectDeclaration
      summary: 'Confirm a report as the person who had the accident'
      description: "Record the declaration of the person who had the accident, by typing\ntheir name. The time is captured automatically.\n\nAnyone who can view the report may record the declaration, matching the\nweb app. Check `meta.can.record_subject_declaration` on the report to\ndecide whether to offer it.\n\nReturns 422 when the report has already been confirmed, or when the\nreporter is the person who had the accident (their own declaration\nalready covers it).\n"
      tags:
        - 'Accident Book'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/AccidentsTeamId'
        -
          $ref: '#/components/parameters/AccidentReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccidentSubjectDeclarationCreate'
            example:
              subject_declared_name: 'Alex Visitor'
      responses:
        200:
          description: 'Declaration recorded'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/AccidentReport' }, meta: { $ref: '#/components/schemas/AccidentTeamMeta' } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/AccidentsForbidden'
        404:
          $ref: '#/components/responses/AccidentsNotFound'
        422:
          description: "The declaration name is missing, the report has already been\nconfirmed, or the reporter is the person who had the accident.\n"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccidentValidationError' }
              examples: { alreadyDeclared: { summary: 'The report has already been confirmed', value: { message: 'The person who had the accident has already confirmed this report.', meta: { team_id: 1 } } }, reporterIsSubject: { summary: 'The reporter had the accident', value: { message: 'The person who had the accident recorded it, so their declaration is already on the report.', meta: { team_id: 1 } } }, missingName: { summary: 'No name was given', value: { message: 'The subject declared name field is required.', errors: { subject_declared_name: ['The subject declared name field is required.'] } } } }
        500:
          $ref: '#/components/responses/ServerError'
  /auth/companion-token:
    post:
      operationId: issueCompanionToken
      summary: 'Issue tokens for a paired companion device'
      description: "Issues a separate access/refresh token pair for a companion device paired\nwith the calling device — for example an Apple Watch paired with the iPhone\nthat holds the primary session. The companion can then reach the API on its\nown rather than mirroring whatever the primary device last pushed to it.\n\nThe response is the same shape as `/auth/login` and `/auth/refresh`, minus\nthe `user` object, so existing token decoding can be reused.\n\n**Separate device name required**: token revocation is prefix-based on the\ndevice name, so two devices whose names are prefixes of one another delete\neach other's tokens on every issue and refresh. A colliding `device_name`\nis rejected with `422` rather than silently signing the other device out.\n\n**Companion tokens differ from primary tokens**:\n- Refresh lifetime is 7 days, not 30 — a lost watch expires sooner.\n- Abilities are `access`, `read` and `companion`. `/auth/refresh` reads the\n  `companion` ability off the presented refresh token, so a refreshed\n  companion pair keeps the shorter lifetime and the same abilities.\n- A companion token cannot itself pair further devices (`403`).\n\n**Device verification**: the companion inherits the trust of the\nalready-authenticated device making the call. No verification flow is\ntriggered and no new trusted device is enrolled.\n"
      tags:
        - Authentication
      security:
        -
          sanctum: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties: { device_name: { type: string, maxLength: 255, description: "Name identifying the companion device. Must not be a prefix of,\nand must not be prefixed by, any existing device name on this\naccount (compared case-insensitively).\n", example: "Tom's Apple Watch" } }
      responses:
        200:
          description: 'Companion tokens issued'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { access_token: { type: string, description: 'Access token for the companion device', example: 3|abc123xyz789 }, refresh_token: { type: string, description: 'Refresh token for the companion device (7-day lifetime)', example: 4|def456uvw012 }, token_type: { type: string, example: Bearer }, expires_in: { type: integer, description: 'Access token lifetime in seconds', example: 3600 } } } } }
        401:
          description: 'Authentication token is missing or invalid'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: Unauthenticated. } } }
        403:
          description: "The presented token lacks the `access` ability (for example a refresh\ntoken), or the caller is itself a companion device.\n"
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'A companion device cannot pair further devices.' } } }
        422:
          description: "The requested device name collides with an existing device. Because\ntokens are revoked by device-name prefix, allowing the name would sign\nthe other device out on its next refresh.\n"
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'The device name conflicts with an existing device ("Tom''s iPhone 17 Pro Max").' }, errors: { type: object, properties: { device_name: { type: array, items: { type: string }, example: ['The device name conflicts with an existing device ("Tom''s iPhone 17 Pro Max"). Choose a name that is not a prefix of, and is not prefixed by, another device name.'] } } } } }
        429:
          description: 'Too many requests (limited to 5 per minute)'
        500:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: revokeCompanionToken
      summary: "Revoke a companion device's tokens"
      description: "Revokes both tokens belonging to a companion device, without disturbing the\ncalling device's own session. Use this when a companion device is lost, so\nthat the primary device does not have to re-authenticate.\n\nThe device name must match exactly. To revoke the calling device itself,\nuse `/auth/logout`.\n"
      tags:
        - Authentication
      security:
        -
          sanctum: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties: { device_name: { type: string, maxLength: 255, description: 'Exact device name the companion tokens were issued under', example: "Tom's Apple Watch" } }
      responses:
        200:
          description: 'Companion tokens revoked'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { message: { type: string, example: 'Companion device tokens revoked' } } } } }
        401:
          description: 'Authentication token is missing or invalid'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: Unauthenticated. } } }
        403:
          description: 'The presented token lacks the `access` ability'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'Invalid ability provided.' } } }
        404:
          description: 'No tokens exist for that device name'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'No tokens found for that device.' } } }
        422:
          description: "The device name is missing, or names the calling device — use\n`/auth/logout` to revoke the current device.\n"
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'Use the logout endpoint to revoke the current device.' } } }
        429:
          description: 'Too many requests (limited to 5 per minute)'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/dev/login:
    post:
      operationId: devLogin
      summary: 'Issue tokens for a chosen account without a password'
      description: "Issues an access/refresh token pair for the selected user, with no\npassword and no device verification.\n\nThe response is identical in shape to `/auth/login`, so the same token\nstorage and refresh handling applies — including `/auth/refresh`, which\nworks normally for tokens issued here.\n\n**Only exists on non-production environments**, exactly as for\n`/auth/dev/users`; see that endpoint for the `404` behaviour.\n\nTokens are issued under the device name `Developer Login` unless\n`device_name` is supplied.\n"
      tags:
        - Authentication
      security: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties: { user_id: { type: integer, description: "`id` of the chosen account, as returned by `/auth/dev/users`.\n", example: 1 }, device_name: { type: string, description: 'Optional device identifier for token management', example: 'iPhone 15 Pro' } }
      responses:
        200:
          description: 'Tokens issued'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { access_token: { type: string, description: 'Access token for API requests', example: 1|abc123xyz789 }, refresh_token: { type: string, description: 'Refresh token for obtaining new access tokens', example: 2|def456uvw012 }, token_type: { type: string, example: Bearer }, expires_in: { type: integer, description: 'Access token lifetime in seconds', example: 3600 }, user: { type: object, properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'Alex Harbourne' }, email: { type: string, example: alex.harbourne@example.com } } } } } } }
        404:
          $ref: '#/components/responses/DevLoginUnavailable'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/dev/users:
    get:
      operationId: listDevLoginUsers
      summary: 'List accounts available for developer login'
      description: "Lists the accounts that `/auth/dev/login` will issue a token for, with\ntheir team memberships, so the app can offer a picker instead of asking\nfor credentials.\n\n**Only exists on non-production environments.** The routes are\nregistered only where developer login is enabled: `APP_ENV` must be one\nof `local`, `develop`, `development`, `feature` or `testing`, and the\nrequest host must be one that only serves throwaway data (`*.test`,\n`localhost`, `*.laravel.cloud`, `*.onamp.dev`). Production is refused\nwhatever the configuration says. Everywhere else this returns `404` —\nthe same as any unknown path. Clients should treat a `404` as \"this\nbuild is pointed at an environment without developer login\" rather than\nas an error worth surfacing.\n\nRequires no authentication: it is what the app calls before it has a\ntoken.\n"
      tags:
        - Authentication
      security: {}
      responses:
        200:
          description: 'Accounts available to sign in as'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/DevLoginUser' } } } }
        404:
          $ref: '#/components/responses/DevLoginUnavailable'
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/device/methods:
    get:
      operationId: getDeviceVerificationMethods
      summary: 'Get available device verification methods'
      description: "Returns the available verification methods for the current verification session.\nMethods may include email, SMS, TOTP (authenticator app) and backup codes depending\non the user's account configuration.\n\n`passkey` is not currently offered over the API: completing it needs a WebAuthn\nassertion, and no API endpoint accepts one yet. It is still listed as a known\nvalue below, since it will appear here once that support lands.\n\nThe set of methods is open-ended and grows over time. Clients must ignore any\n`method` value they do not recognise rather than failing to decode the response.\n"
      tags:
        - 'Device Verification'
      security:
        -
          verificationSession: {}
      responses:
        200:
          description: 'Available verification methods'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { available_methods: { type: array, items: { $ref: '#/components/schemas/VerificationMethod' } } } } } }
              example: { data: { available_methods: [{ method: email, label: Email, description: 'Receive a verification code via email', masked_destination: 't***@example.com' }, { method: sms, label: SMS, description: 'Receive a verification code via SMS', masked_destination: '****1234' }, { method: totp, label: 'Authenticator App', description: 'Use your authenticator app' }] } }
        401:
          description: 'Invalid or expired verification session'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSessionError' }
        500:
          $ref: '#/components/responses/ServerError'
  /auth/device/send-code:
    post:
      operationId: sendDeviceVerificationCode
      summary: 'Send verification code via email or SMS'
      description: "Sends a one-time verification code to the user via the specified method (email or SMS).\nThis endpoint is rate-limited to 3 requests per minute.\n\n**Note**: This endpoint is only used for email and SMS methods. TOTP and backup code\nverification do not require sending a code first.\n"
      tags:
        - 'Device Verification'
      security:
        -
          verificationSession: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties: { method: { type: string, enum: [email, sms], description: 'The delivery method for the verification code', example: email } }
      responses:
        200:
          description: 'Verification code sent successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { message: { type: string, example: 'Verification code sent' }, method: { type: string, example: email }, expires_in: { type: integer, description: 'Code expiration time in seconds', example: 300 } } } } }
        401:
          description: 'Invalid or expired verification session'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSessionError' }
        422:
          description: 'Validation error'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'The given data was invalid' }, errors: { type: object, properties: { method: { type: array, items: { type: string }, example: ['The verification method must be either sms or email.'] } } } } }
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/device/verify:
    post:
      operationId: verifyDeviceCode
      summary: 'Verify code and issue API tokens'
      description: "Verifies the provided code and issues API tokens upon successful verification.\nAlso returns a device token that can be stored and used in subsequent logins\nto bypass device verification.\n\n**Supported verification methods**:\n- `email` - 6-digit OTP sent via email\n- `sms` - 6-digit OTP sent via SMS\n- `totp` - 6-digit code from authenticator app\n- `backup_code` - 8-character backup code\n\nThis endpoint is rate-limited to 5 requests per minute.\n"
      tags:
        - 'Device Verification'
      security:
        -
          verificationSession: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, method]
              properties: { code: { type: string, description: "The verification code. Format depends on method:\n- email/sms/totp: 6-digit numeric code\n- backup_code: 8-character alphanumeric code\n", example: '123456' }, method: { type: string, enum: [email, sms, totp, backup_code], description: 'The verification method used', example: email }, device_name: { type: string, description: 'Optional name for this device (for token management)', example: 'iPhone 15 Pro' } }
            examples:
              email_verification: { summary: 'Email OTP verification', value: { code: '123456', method: email, device_name: 'iPhone 15 Pro' } }
              totp_verification: { summary: 'TOTP (Authenticator) verification', value: { code: '123456', method: totp } }
              backup_code_verification: { summary: 'Backup code verification', value: { code: ABCD1234, method: backup_code } }
      responses:
        200:
          description: 'Verification successful, tokens issued'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { access_token: { type: string, description: 'JWT access token for API requests', example: 1|abc123xyz789 }, refresh_token: { type: string, description: 'Refresh token for obtaining new access tokens', example: 2|def456uvw012 }, token_type: { type: string, example: Bearer }, expires_in: { type: integer, description: 'Access token lifetime in seconds', example: 3600 }, user: { type: object, properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'John Doe' }, email: { type: string, example: user@example.com } } } } }, device_token: { type: string, description: "Store this token securely on the device. Include it in the\n`X-Device-Token` header on subsequent login requests to bypass\ndevice verification.\n", example: dvc_abc123xyz789... } } }
        401:
          description: 'Invalid or expired verification session'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSessionError' }
        422:
          description: 'Invalid verification code'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'Verification failed' }, errors: { type: object, properties: { code: { type: array, items: { type: string }, example: ['Invalid verification code'] } } } } }
              examples: { invalid_code: { summary: 'Invalid verification code', value: { message: 'Verification failed', errors: { code: ['Invalid verification code'] } } }, expired_code: { summary: 'Expired verification code', value: { message: 'Verification failed', errors: { code: ['The verification code has expired'] } } } }
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/login:
    post:
      operationId: login
      summary: 'Authenticate user and issue tokens'
      description: "Authenticates a user with email and password, returning both access and refresh tokens.\nThe access token has a shorter lifespan for security, while the refresh token\nallows obtaining new access tokens without re-authentication (ideal for Face ID apps).\n\n**Device Verification**: If the device is not trusted, returns a 403 response with a\nverification token. The client must then complete device verification before receiving\nAPI tokens. To bypass verification on subsequent logins, include the `X-Device-Token`\nheader obtained after successful verification.\n"
      tags:
        - Authentication
      security: {}
      parameters:
        -
          name: X-Device-Token
          in: header
          description: "Device token obtained after successful device verification.\nInclude this header to bypass device verification on subsequent logins.\n"
          required: false
          schema:
            type: string
            example: dvc_abc123xyz789...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string, format: email, description: "User's email address", example: user@example.com }, password: { type: string, format: password, description: "User's password", example: SecurePassword123! }, device_name: { type: string, description: 'Optional device identifier for token management', example: 'iPhone 15 Pro' } }
      responses:
        200:
          description: 'Authentication successful'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { access_token: { type: string, description: 'JWT access token for API requests', example: 1|abc123xyz789 }, refresh_token: { type: string, description: 'Refresh token for obtaining new access tokens', example: 2|def456uvw012 }, token_type: { type: string, description: 'Token type', example: Bearer }, expires_in: { type: integer, description: 'Access token lifetime in seconds', example: 3600 }, user: { type: object, properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'John Doe' }, email: { type: string, example: user@example.com } } } } } } }
        403:
          description: 'Device verification required'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceVerificationRequiredResponse' }
              example: { message: 'Device verification required', error_code: DEVICE_VERIFICATION_REQUIRED, data: { verification_token: abc123xyz789..., verification_token_expires_in: 300, available_methods: [{ method: email, label: Email, description: 'Receive a verification code via email', masked_destination: 't***@example.com' }, { method: sms, label: SMS, description: 'Receive a verification code via SMS', masked_destination: '****1234' }, { method: totp, label: 'Authenticator App', description: 'Use your authenticator app' }], user: { id: 1, name: 'John Doe' } } }
        422:
          description: 'Validation error'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'The given data was invalid' }, errors: { type: object, properties: { email: { type: array, items: { type: string }, example: ['The email field is required.'] }, password: { type: array, items: { type: string }, example: ['The password field is required.'] } } } } }
        401:
          description: 'Invalid credentials'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'Invalid credentials' } } }
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/logout:
    post:
      operationId: logout
      summary: 'Logout user and revoke tokens'
      description: "Revokes the current access token and associated refresh token,\neffectively logging the user out of the current device.\n"
      tags:
        - Authentication
      security:
        -
          sanctum: {}
      responses:
        200:
          description: 'Logout successful'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { message: { type: string, example: 'Successfully logged out' } } } } }
        401:
          description: 'Authentication token is missing or invalid'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: Unauthenticated. } } }
        500:
          $ref: '#/components/responses/ServerError'
  /auth/password-reset-request:
    post:
      operationId: requestPasswordReset
      summary: 'Request password reset'
      description: "Initiates a password reset process by generating a one-time passcode (OTP)\nand sending it via the specified delivery method (SMS or email).\nIf no delivery method is specified, uses environment-based defaults:\n- Development/Staging: email (for cost savings)\n- Production: SMS (for better security)\n\n**Security Note**: This endpoint always returns success to prevent email enumeration attacks.\nIf the email address doesn't exist, no OTP is sent but the same success response is returned.\n"
      tags:
        - Authentication
      security: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email, description: 'Email address of the user requesting password reset', example: user@example.com }, delivery_method: { type: string, enum: [sms, email], description: "Method for delivering the OTP code. If not provided, uses environment defaults:\n- Development/Staging environments: email\n- Production environment: sms\n", example: email } }
            examples:
              email_request: { summary: 'Password reset via email', value: { email: john.doe@example.com, delivery_method: email } }
              sms_request: { summary: 'Password reset via SMS', value: { email: john.doe@example.com, delivery_method: sms } }
              default_request: { summary: 'Password reset using environment default', value: { email: john.doe@example.com } }
      responses:
        200:
          description: 'Password reset request processed successfully (always returned regardless of user existence)'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { message: { type: string, description: "Generic success message that doesn't reveal user existence", example: 'If an account with that email address exists, we have sent a reset code.' }, delivery_method: { type: string, description: "The delivery method that was requested or defaulted to\n\nKnown values: `sms`, `email`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n", example: email }, expires_in: { type: integer, description: 'Token expiration time in seconds (always shown for consistency)', example: 900 } } } } }
              examples: { email_success: { summary: 'Password reset request with email delivery', value: { data: { message: 'If an account with that email address exists, we have sent a reset code.', delivery_method: email, expires_in: 900 } } }, sms_success: { summary: 'Password reset request with SMS delivery', value: { data: { message: 'If an account with that email address exists, we have sent a reset code.', delivery_method: sms, expires_in: 900 } } } }
        422:
          description: 'Validation error'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'The given data was invalid' }, errors: { type: object, properties: { email: { type: array, items: { type: string }, example: ['The email field is required.'] }, delivery_method: { type: array, items: { type: string }, example: ['The selected delivery method is invalid. Must be "sms" or "email".'] } } } } }
              examples: { missing_email: { summary: 'Missing email field', value: { message: 'The given data was invalid', errors: { email: ['The email field is required.'] } } }, invalid_email: { summary: 'Invalid email format', value: { message: 'The given data was invalid', errors: { email: ['The email must be a valid email address.'] } } }, invalid_delivery_method: { summary: 'Invalid delivery method', value: { message: 'The given data was invalid', errors: { delivery_method: ['The selected delivery method is invalid. Must be "sms" or "email".'] } } } }
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: 'Refresh access token'
      description: "Uses a valid refresh token to obtain a new access token without requiring\nre-authentication. This is essential for Face ID apps to maintain seamless\nuser experience without frequent login prompts.\n"
      tags:
        - Authentication
      security: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string, description: 'Valid refresh token obtained from login', example: 2|def456uvw012 } }
      responses:
        200:
          description: 'Token refresh successful'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { access_token: { type: string, description: 'New JWT access token', example: 3|ghi789rst345 }, refresh_token: { type: string, description: 'New refresh token (old one is invalidated)', example: 4|jkl012mno678 }, token_type: { type: string, example: Bearer }, expires_in: { type: integer, description: 'Access token lifetime in seconds', example: 3600 } } } } }
        422:
          description: 'Validation error'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'The given data was invalid' }, errors: { type: object, properties: { refresh_token: { type: array, items: { type: string }, example: ['The refresh token field is required.'] } } } } }
        401:
          description: 'Invalid or expired refresh token'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'Invalid or expired refresh token' } } }
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: 'Reset password with new password'
      description: "Completes the password reset process by setting a new password using the\nreset token obtained from OTP verification. The token is consumed and deleted\nafter successful password reset.\n"
      tags:
        - Authentication
      security: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, password, password_confirmation]
              properties: { reset_token: { type: integer, description: 'Reset token obtained from OTP verification', example: 123 }, password: { type: string, format: password, description: 'New password (must meet password requirements)', example: NewSecurePassword123! }, password_confirmation: { type: string, format: password, description: 'Password confirmation (must match password)', example: NewSecurePassword123! } }
            examples:
              valid_request: { summary: 'Valid password reset request', value: { reset_token: 123, password: NewSecurePassword123!, password_confirmation: NewSecurePassword123! } }
      responses:
        200:
          description: 'Password reset successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { message: { type: string, description: 'Success message', example: 'Your password has been reset successfully' } } } } }
              examples: { success_response: { summary: 'Successful password reset', value: { data: { message: 'Your password has been reset successfully' } } } }
        422:
          description: 'Validation error or invalid token'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'The given data was invalid' }, errors: { type: object, properties: { reset_token: { type: array, items: { type: string }, example: ['The reset token is invalid or has already been used.'] }, password: { type: array, items: { type: string }, example: ['The password confirmation does not match.'] } } } } }
              examples: { invalid_token: { summary: 'Invalid reset token', value: { message: 'The given data was invalid', errors: { reset_token: ['The reset token is invalid or has already been used.'] } } }, password_mismatch: { summary: 'Password confirmation mismatch', value: { message: 'The given data was invalid', errors: { password: ['The password confirmation does not match.'] } } } }
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  '/auth/social/{provider}':
    post:
      operationId: socialLogin
      summary: 'Authenticate using a social provider token'
      description: "Exchange a provider-issued token (obtained natively by the mobile app via the\nprovider's SDK) for SupportManager API tokens.\n\nThe mobile client should:\n1. Use the native SDK (Google Sign-In, Sign in with Apple, MSAL) to obtain an\n   ID token or access token for the chosen provider.\n2. POST the token to this endpoint with the provider in the URL.\n3. Receive the same access/refresh token pair as `POST /auth/login`.\n\nThe server verifies the token with the provider via Laravel Socialite's\n`stateless()->userFromToken()`, resolves the SupportManager user (matching by\na previously linked social account, or auto-linking by verified email), and\nissues Sanctum tokens.\n\n**Device Verification**: Identical to `/auth/login` — if the device is not\ntrusted the response is `403 DEVICE_VERIFICATION_REQUIRED`, and the client\nmust complete verification before tokens are issued.\n\n**Account linking**: If no `SocialAccount` row exists for this provider/id,\nthe backend will auto-link to a user whose email matches the verified\nprovider email. If no email match exists, `422` is returned — there is no\nuser-creation path via social login.\n"
      tags:
        - Authentication
      security: {}
      parameters:
        -
          name: provider
          in: path
          required: true
          description: 'The social provider identifier.'
          schema:
            type: string
            enum:
              - google
              - microsoft
              - apple
          example: google
        -
          name: X-Device-Token
          in: header
          required: false
          description: 'Device token to bypass device verification on subsequent logins.'
          schema:
            type: string
            example: dvc_abc123xyz789...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string, description: "The provider-issued token to verify. For Google and Microsoft this is\ntypically the OAuth access token. For Apple this is the identity token\nreturned by Sign in with Apple.\n", example: ya29.a0AfH6SMB... }, device_name: { type: string, description: 'Optional device identifier for token management.', example: 'iPhone 15 Pro' } }
      responses:
        200:
          description: 'Authentication successful'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { access_token: { type: string, example: 1|abc123xyz789 }, refresh_token: { type: string, example: 2|def456uvw012 }, token_type: { type: string, example: Bearer }, expires_in: { type: integer, example: 3600 }, user: { type: object, properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'John Doe' }, email: { type: string, example: user@example.com } } } } } } }
        403:
          description: 'Device verification required'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceVerificationRequiredResponse' }
        404:
          description: 'Unsupported provider (URL segment did not match a configured provider)'
        422:
          description: "Validation error. Possible causes:\n- `token` missing or empty\n- The provider rejected the token (`errors.token`)\n- The verified email does not match any SupportManager user (`errors.social`)\n- The matched user is inactive (`errors.social`)\n- The provider is not configured on this environment\n"
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string }, errors: { type: object, additionalProperties: { type: array, items: { type: string } } } } }
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /auth/verify-otp:
    post:
      operationId: verifyOtp
      summary: 'Verify OTP and unlock account'
      description: "Verifies the one-time passcode (OTP) sent via SMS and unlocks the account\nfor password reset. Returns a reset token for use in the final password reset step.\n"
      tags:
        - Authentication
      security: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties: { email: { type: string, format: email, description: 'Email address of the user', example: user@example.com }, otp: { type: string, pattern: '^[0-9]{6}$', description: '6-digit OTP code received via SMS', example: '123456' } }
            examples:
              valid_request: { summary: 'Valid OTP verification request', value: { email: john.doe@example.com, otp: '123456' } }
      responses:
        200:
          description: 'OTP verified successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { message: { type: string, description: 'Success message', example: 'OTP verified successfully' }, reset_token: { type: integer, description: 'Token ID for password reset', example: 123 }, expires_in: { type: integer, description: 'Token expiration time in seconds', example: 300 } } } } }
              examples: { success_response: { summary: 'Successful OTP verification', value: { data: { message: 'OTP verified successfully', reset_token: 123, expires_in: 300 } } } }
        422:
          description: 'Validation error or invalid OTP'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'The given data was invalid' }, errors: { type: object, properties: { email: { type: array, items: { type: string }, example: ['User not found with this email address.'] }, otp: { type: array, items: { type: string }, example: ['The code you entered is incorrect. Please try again.'] } } } } }
              examples: { invalid_otp: { summary: 'Invalid OTP code', value: { message: 'The given data was invalid', errors: { otp: ['The code you entered is incorrect. Please try again.'] } } }, expired_otp: { summary: 'Expired OTP code', value: { message: 'The given data was invalid', errors: { otp: ['The code you entered has expired. Please request a new one.'] } } } }
        429:
          $ref: '#/components/responses/TooManyRequestsError'
        500:
          $ref: '#/components/responses/ServerError'
  /capabilities:
    get:
      operationId: getCapabilities
      summary: 'Describe what the user can do in the team'
      description: "Retrieve the authenticated user's role in the current team, the team's\nsubscription, plan features and optional modules, and the navigation\nthe web app gives the user.\n\n`plan_features` and `modules` contain every known key, each mapped to a\nboolean. A module is only `true` when the team's plan allows it *and*\nthe team has switched it on. Both lists may grow; ignore keys you do not\nrecognise.\n\n`navigation` lists the web navigation areas that have pages about the\nuser themselves, with those pages. Pages about the whole team (such as\nleave approvals or payroll runs) are left out. `route_name` is the web\nroute of the page, for mapping onto a native screen.\n\n**Authorization:** Every role, including former PAs. Unlike the rest of\nthe API it also answers for a team without an active subscription, with\n`subscribed: false`.\n"
      tags:
        - Dashboard
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Capabilities retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/DashboardCapabilities' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
              example: { data: { role: PA, is_privileged: false, is_employee: true, is_former_pa: false, subscribed: true, plan_features: { dashboard: true, rota: true, holidays: true, documents: true, car_journeys: true, timesheets: true, payroll: true, auditing: true, recruitment: true, e_signing: true, agencies: true, ai_assistance: true }, modules: { household: true, car_journeys: true, accidents: false, recruitment: false, agencies: false, e_signing: false }, navigation: [{ key: today, label: Today, icon: sun, items: [{ label: Today, icon: sun, route_name: dashboard }] }, { key: pay, label: Pay, icon: banknotes, items: [{ label: Payslips, icon: banknotes, route_name: payroll.index }, { label: P60s, icon: document-text, route_name: payroll.p60s }] }] }, meta: { team_id: 1 } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          description: 'The token is not an access token'
        500:
          $ref: '#/components/responses/ServerError'
  /car-journeys:
    get:
      operationId: getCarJourneys
      summary: 'List car journeys'
      description: "Retrieve a paginated list of car journeys for the authenticated user's team.\n\nAdmins and managers see the team's full journey history. Everyone else\nsees only completed journeys that ended in the last 30 days, matching the\nweb app's journey list.\n\nEveryone can filter by user and driver name. Filtering by date range and\nongoing status is limited to admins and managers; anyone else who sends\nthose filters gets a 400.\nResults are sorted by trip_start descending by default.\n"
      tags:
        - 'Car Journeys'
      security:
        -
          sanctum: {}
      parameters:
        -
          name: X-Team-ID
          in: header
          description: 'Team ID for tenant context'
          required: true
          schema:
            type: integer
          example: 1
        -
          name: page
          in: query
          description: 'Page number for pagination'
          schema:
            type: integer
            minimum: 1
          example: 1
        -
          name: per_page
          in: query
          description: 'Number of items per page'
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 15
        -
          name: 'filter[user_id]'
          in: query
          description: 'Filter by user ID'
          schema:
            type: integer
          example: 5
        -
          name: 'filter[driver_name]'
          in: query
          description: 'Filter by driver name (partial match)'
          schema:
            type: string
          example: John
        -
          name: 'filter[trip_start_from]'
          in: query
          description: 'Filter journeys starting on or after this date. Admins and managers only.'
          schema:
            type: string
            format: date
          example: '2024-01-01'
        -
          name: 'filter[trip_start_to]'
          in: query
          description: 'Filter journeys starting on or before this date. Admins and managers only.'
          schema:
            type: string
            format: date
          example: '2024-01-31'
        -
          name: 'filter[ongoing]'
          in: query
          description: 'Filter by ongoing status (true = trip_end is null). Admins and managers only.'
          schema:
            type: boolean
          example: true
        -
          name: sort
          in: query
          description: 'Sort field (prefix with - for descending)'
          schema:
            type: string
            enum:
              - trip_start
              - trip_end
              - created_at
              - driver_name
              - '-trip_start'
