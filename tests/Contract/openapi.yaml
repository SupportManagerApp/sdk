          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updateHolidayRequest
      summary: 'Update holiday request'
      description: "Update an existing holiday request.\n\n**Authorization:** Owner of the request or privileged users (Admin/Manager).\n\n- The date fields (`type`, `start_date`, `end_date`) are required while the dates can\n  still be edited, and are refused with a 422 once they cannot: a request that is\n  cancelled, or approved or rejected and starting within 28 days, or a not-working\n  notice. Leave them out to change only the comments. `meta.can.edit_dates` on the\n  request says which applies.\n- For `Whole Days`, `start_date` and `end_date` are the first and last days off; the\n  leave runs from 08:00 on the first day to 08:00 the day after the last.\n- On the requester's own request, `hours` and `sleeps` are worked out by the server from\n  their working pattern and are refused with a 422 if sent. A privileged user editing\n  someone else's request sends them along with the dates.\n- When the owner edits their own approved or rejected request starting at least 28 days\n  from now, it goes back to `Pending` for re-approval.\n- `approver_comments` is accepted only from privileged users; anyone else gets a 422.\n"
      tags:
        - 'Holiday Requests'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/HolidayRequestId'
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHolidayRequestInput'
      responses:
        200:
          description: 'Holiday request updated successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/HolidayRequest' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/HolidayValidationError'
        500:
          $ref: '#/components/responses/ServerError'
    put:
      operationId: replaceHolidayRequest
      summary: 'Update holiday request (PUT)'
      description: "Update an existing holiday request. Equivalent to the PATCH variant;\nboth verbs reach the same controller action and accept the same fields.\n\n**Authorization:** Owner of the request or privileged users (Admin/Manager).\n\n- The date fields (`type`, `start_date`, `end_date`) are required while the dates can\n  still be edited, and are refused with a 422 once they cannot: a request that is\n  cancelled, or approved or rejected and starting within 28 days, or a not-working\n  notice. Leave them out to change only the comments. `meta.can.edit_dates` on the\n  request says which applies.\n- For `Whole Days`, `start_date` and `end_date` are the first and last days off; the\n  leave runs from 08:00 on the first day to 08:00 the day after the last.\n- On the requester's own request, `hours` and `sleeps` are worked out by the server from\n  their working pattern and are refused with a 422 if sent. A privileged user editing\n  someone else's request sends them along with the dates.\n- When the owner edits their own approved or rejected request starting at least 28 days\n  from now, it goes back to `Pending` for re-approval.\n- `approver_comments` is accepted only from privileged users; anyone else gets a 422.\n"
      tags:
        - 'Holiday Requests'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/HolidayRequestId'
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHolidayRequestInput'
      responses:
        200:
          description: 'Holiday request updated successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/HolidayRequest' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/HolidayValidationError'
        500:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteHolidayRequest
      summary: 'Delete holiday request'
      description: "Delete an existing holiday request.\n\n**Authorization:** Administrators only.\n"
      tags:
        - 'Holiday Requests'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/HolidayRequestId'
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Holiday request deleted successfully'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: 'Holiday request deleted successfully.' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/ServerError'
