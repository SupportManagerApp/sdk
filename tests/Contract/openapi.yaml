  /payroll/starter-declaration:
    get:
      operationId: getPayrollStarterDeclaration
      summary: 'Get your payroll starter declaration'
      description: "Retrieve the authenticated employee's own starter declaration, NI number and the\npayroll details it sets, with a short-lived URL for any stored P45.\n\nAnswers the employee has not given yet are `null`.\n\n**Authorization:**\n- Employees (Personal Assistants and Managers) can view and update their own declaration\n- Former Personal Assistants can view their declaration read-only (`meta.can.update` is `false`)\n- Admins, family members and contractors receive 403\n"
      tags:
        - 'Starter Declaration'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Starter declaration retrieved successfully'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollStarterDeclarationResponse' }
              example: { data: { ni_number: AB123456C, tax_form_type: P45, starter_declaration_circumstances: A, leaving_date: '2026-06-30', total_pay_to_date: 8000.5, total_tax_to_date: 950.25, final_pay_period_type: monthly, final_pay_period_number: 3, tax_form_url: 'https://files.example.com/payroll-starter-declarations/1/5/p45.pdf?signature=...', national_insurance_letter: A, student_loan_plan: plan_2, postgraduate_loan: false, tax_code: 1257L, week1_month1: false, updated_at: '2026-07-01T09:30:00.000000Z' }, meta: { can: { update: true }, team_id: 1 } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updatePayrollStarterDeclaration
      summary: 'Save your payroll starter declaration'
      description: "Save the authenticated employee's starter declaration, NI number and payroll details,\nand complete their `payroll.payroll_starter` task, exactly as the web task form does.\n\nSend `multipart/form-data` so a P45 can be uploaded in `tax_form_file`. The P45 fields\n(`tax_code`, `week1_month1`, `leaving_date`, `total_pay_to_date`, `total_tax_to_date`,\n`final_pay_period_type`, `final_pay_period_number`, `tax_form_file`) are only validated\nand saved when `tax_form_type` is `P45`. `tax_form_file` is required for a P45 unless one\nis already stored, in which case leaving it out keeps the stored file.\n\nReturns the saved declaration in the same shape as `GET`.\n\n**Authorization:** Employees (Personal Assistants and Managers) only. Former Personal\nAssistants, admins, family members and contractors receive 403.\n"
      tags:
        - 'Starter Declaration'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayrollStarterDeclarationInput'
      responses:
        200:
          description: 'Starter declaration saved'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollStarterDeclarationResponse' }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { message: 'Please upload your P45 document.', errors: { tax_form_file: ['Please upload your P45 document.'] } }
        500:
          $ref: '#/components/responses/ServerError'
