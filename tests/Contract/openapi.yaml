        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/RotaValidationError'
        500:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: retractSleepoverApplication
      summary: 'Withdraw a sleepover application'
      description: "Withdraw your pending applications for every segment of the sleepover.\nA 422 when you have nothing pending on it. Needs a token with the\n`access` ability.\n"
