              examples: { withPayslip: { summary: 'Upcoming payslip exists', value: { data: { id: '5', type: payslips, attributes: { team_id: 1, user_id: 5, process_date: '2024-03-28', total_gross: '2500.00', net_pay_formatted: '1875.00', status: published } }, meta: { team_id: 1 } } }, noPayslip: { summary: 'No upcoming payslip', value: { data: null, meta: { team_id: 1 } } } }
