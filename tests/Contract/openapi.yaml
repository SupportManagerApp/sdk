              schema: { type: object, properties: { data: { type: object, properties: { requirement: { type: object, description: 'Calculated hours and sleeps required for this period', properties: { hours: { type: number, format: float, example: 40.0 }, sleeps: { type: integer, example: 5 } } }, current_balance: { type: object, description: 'Current balance before this request', properties: { hours: { type: object, properties: { entitlement: { type: number, format: float, example: 200.0 }, pending: { type: number, format: float, example: 24.0 }, approved: { type: number, format: float, example: 40.0 }, remaining: { type: number, format: float, example: 136.0 } } }, sleeps: { type: object, properties: { entitlement: { type: number, format: float, example: 28.0 }, pending: { type: number, format: float, example: 2.0 }, approved: { type: number, format: float, example: 5.0 }, remaining: { type: number, format: float, example: 21.0 } } } } }, balance_after_request: { type: object, description: 'Projected remaining balance after this request is approved', properties: { hours: { type: number, format: float, example: 96.0 }, sleeps: { type: integer, example: 16 } } }, year: { type: integer, description: 'The leave year this calculation applies to', example: 2024 } } }, meta: { type: object, properties: { team_id: { type: integer } } } } }
              example: { data: { requirement: { hours: 40.0, sleeps: 5 }, current_balance: { hours: { entitlement: 200.0, pending: 24.0, approved: 40.0, remaining: 136.0 }, sleeps: { entitlement: 28.0, pending: 2.0, approved: 5.0, remaining: 21.0 } }, balance_after_request: { hours: 96.0, sleeps: 16 }, year: 2024 }, meta: { team_id: 1 } }
