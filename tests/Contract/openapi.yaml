  /payroll/estimated-pay:
    get:
      operationId: getEstimatedPay
      summary: 'Get estimated pay'
      description: "Calculate estimated pay for a given month based on scheduled shifts, rates,\nenhancements, and (where available) statutory deductions.\n\nThe response is organised as:\n\n- `hours` / `sleeps`: aggregated work counts (in `total_value`) and their\n  monetary value (in `total_cost`), with per-type `breakdown` arrays\n  (Contracted, Annual Leave, Overtime, etc).\n- `enhancements`: each non-hours/non-sleep payroll line, including\n  bank-holiday enhancements, holiday cover, and — for bank workers from\n  2025 onwards — a `Rolled Up Holiday Pay` entry calculated at 12.07%\n  of qualifying earnings. `total_value` is always `0` for enhancements\n  (they have no quantitative unit); the £ amount is in `total_cost`.\n- `grand_total`: gross earnings for the month.\n- `gross_pay` / `net_pay` / `deductions_total` / `deductions`: derived\n  from an existing payslip for the month when one exists, otherwise\n  estimated via the payroll engine using the user's tax code, NI letter,\n  pension settings, and any earnings orders. These fields are `null`\n  when no tax code is configured for the user.\n\n**Authorization:**\n- Employees (Personal Assistant/Manager) can view their own estimated pay\n- Privileged users (Admin/Manager) can pass `user_id` to view the estimate for any member of the current team\n- Family members and contractors receive 403\n"
      tags:
        - 'Estimated Pay'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
        -
          name: month
          in: query
          description: 'Month to calculate (1-12, defaults to current month)'
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 5
        -
          name: year
          in: query
          description: 'Year to calculate (defaults to current year)'
          schema:
            type: integer
          example: 2026
        -
          name: user_id
          in: query
          description: 'Member of the current team to estimate for (privileged users only; ignored for everyone else)'
          schema:
            type: integer
          example: 5
      responses:
        200:
          description: 'Estimated pay calculated successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/EstimatedPay' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
              example: { data: { year: 2026, month: 5, month_label: 'May 2026', hours: { total_value: 164.75, total_cost: 2800.75, breakdown: [{ type: 'Contracted Hours', total_payroll_value: 99, total_cost: 1683 }, { type: 'Annual Leave Hours', total_payroll_value: 23, total_cost: 391 }, { type: 'Overtime Hours', total_payroll_value: 42.75, total_cost: 726.75 }] }, sleeps: { total_value: 14, total_cost: 1298.22, breakdown: [{ type: 'Contracted Sleeping Night', total_payroll_value: 8, total_cost: 741.84 }, { type: 'Annual Leave Sleeping Night', total_payroll_value: 2, total_cost: 185.46 }, { type: 'Overtime Sleeping Night', total_payroll_value: 4, total_cost: 370.92 }] }, enhancements: [{ type: 'Bank Holiday', total_value: 0, total_cost: 347.73 }, { type: 'Exceptional Circumstances', total_value: 0, total_cost: 63.75 }, { type: 'Holiday Cover', total_value: 0, total_cost: 102 }], grand_total: { total_value: 178.75, total_cost: 4612.45 }, gross_pay: 4612.45, net_pay: 3408.67, deductions_total: 1203.78, deductions: { income_tax: 797.27, national_insurance: 259.75, pension: 146.76, student_loan: 0, postgraduate_loan: 0, corrections: {}, earnings_orders: {} } }, meta: { team_id: 1 } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          description: 'Invalid or missing team, or `user_id` is not a member of the current team'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { message: 'The selected user id is invalid.', errors: { user_id: ['The selected user id is invalid.'] } }
        500:
          $ref: '#/components/responses/ServerError'
