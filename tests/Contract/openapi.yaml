              example: { data: [{ id: '1', type: emergency_contacts, attributes: { name: 'Jane Doe', relationship: Spouse, phone_number: '+44 7700 900001', created_at: '2023-01-15T10:00:00Z', updated_at: '2023-06-20T14:30:00Z' } }] }
