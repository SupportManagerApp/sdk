    ShoppingListAddMeta:
      type: object
      description: 'What an add to the shopping list actually did.'
      required:
        - outcome
      properties:
        team_id:
          type: integer
          nullable: true
          example: 1
        outcome:
          type: string
          description: "What the add did. Left an open string deliberately — a generated\nclient must tolerate a value it has not been built for rather than\nfailing to decode the response. Treat anything unrecognised as a\nsuccessful add. The values today:\n\n* `created` — nothing matched; a new item was added.\n* `reactivated` — a matched item that had been bought is needed again.\n* `already_needed` — a matched item already needed purchasing; nothing changed.\n"
          example: reactivated
        matched_name:
          type: string
          nullable: true
          description: 'The canonical name of the item that was matched, so a client can show the spelling it landed on. Null when `outcome` is `created`.'
          example: 'Kitchen roll'
    ShoppingListItem:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          type: string
          example: shopping-list-items
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Milk
            quantity:
              type: integer
              nullable: true
              description: 'Quantity of the item'
              example: 2
            needs_purchasing:
              type: boolean
              description: 'Whether the item still needs to be purchased'
              example: true
            is_maybe:
              type: boolean
              description: 'Whether the item is a "maybe" / nice-to-have'
              example: false
            section:
              type: string
              nullable: true
              description: "The supermarket section the item is found in, or null while it is unsorted. New items are\ncategorised automatically shortly after they are added. Current values: fruit_and_veg, bakery,\nmeat_and_fish, dairy_eggs_and_chilled, food_cupboard, treats_and_snacks, drinks, frozen,\nhealth_and_beauty, baby_and_toddler, household, pets, home_and_car. Treat unknown values as unsorted.\n"
              example: dairy_eggs_and_chilled
            notes:
              type: string
              nullable: true
              description: 'Brand, size or other notes for whoever is buying it'
              example: 'The blue Lurpak, 500g'
            last_purchased_on:
              type: string
              format: date
              nullable: true
              description: 'The date the item was last marked as purchased (null if never purchased)'
              example: '2024-01-14'
            requested_by:
              type: object
              description: 'The user who requested the item'
              properties: { id: { type: integer, example: 1 }, name: { type: string, example: 'John Doe' } }
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00.000000Z'
    ShoppingListItemUpdate:
      type: object
