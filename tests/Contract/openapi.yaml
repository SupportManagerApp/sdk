          example: '1'
        type:
          type: string
          example: users
        attributes:
          type: object
          properties:
            title:
              type: string
              nullable: true
              description: "Known values: `MR`, `MRS`, `MISS`, `MS`, `MX`, `DR`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: MR
            name:
              type: string
              example: 'John Doe'
            email:
              type: string
              format: email
              example: john@example.com
            avatar:
              type: string
              format: uri
              example: 'https://...'
            mobile_number:
              type: string
              nullable: true
              example: '+44 7700 900000'
            date_of_birth:
              type: string
              format: date
              nullable: true
              example: '1990-05-15'
            gender:
              type: string
              nullable: true
              description: "Known values: `male`, `female`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: male
            ni_number:
              type: string
              nullable: true
              description: 'National Insurance Number'
              example: AB123456C
            show_birthday_on_roster:
              type: boolean
