          type: string
          example: '2580.00'
    EstimatedPayBreakdownEntry:
      type: object
      description: "Per-type breakdown row inside `hours.breakdown` or `sleeps.breakdown`.\nNote the legacy field name `total_payroll_value` for the unit count.\n"
      properties:
        type:
          type: string
          description: 'Payroll entry type label.'
          example: 'Contracted Hours'
        total_payroll_value:
          type: number
          format: float
          description: 'Unit count (hours or sleeping nights).'
          example: 99
        total_cost:
          type: number
          format: float
          description: 'Monetary value of this row in £.'
          example: 1683
      required:
        - type
        - total_payroll_value
        - total_cost
    EstimatedPayHoursOrSleeps:
      type: object
      properties:
        total_value:
          type: number
          format: float
          description: 'Total unit count (hours, or sleeping nights).'
          example: 164.75
        total_cost:
          type: number
          format: float
          description: 'Total monetary value of all rows in £.'
          example: 2800.75
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/EstimatedPayBreakdownEntry'
      required:
        - total_value
        - total_cost
        - breakdown
    EstimatedPayEnhancement:
      type: object
      description: "A single non-hours/non-sleep payroll line — bank holiday, holiday cover,\nrolled-up holiday pay, etc. `total_value` is always `0` for\nenhancements; the £ amount is in `total_cost`.\n"
      properties:
        type:
          type: string
          description: "Enhancement label. Possible values include (non-exhaustive):\n`Bank Holiday`, `Exceptional Circumstances`, `Holiday Cover`,\nand `Rolled Up Holiday Pay` (bank workers, from 2025).\n"
          example: 'Bank Holiday'
        total_value:
          type: number
          format: float
          description: 'Always `0` for enhancements.'
          example: 0
        total_cost:
          type: number
          format: float
          description: 'Monetary value of the enhancement in £.'
          example: 347.73
      required:
        - type
        - total_value
        - total_cost
    EstimatedPayDeductionItem:
      type: object
      properties:
        description:
          type: string
          example: 'Overpayment Recovery'
        amount:
          type: number
          format: float
          example: 50.0
      required:
        - description
        - amount
    EstimatedPayDeductions:
      type: object
      description: "Breakdown of statutory and ad-hoc deductions. When a payslip already\nexists for the month, values come from the stored deduction rows;\notherwise they are estimated by the payroll engine. `corrections` and\n`earnings_orders` are itemised separately.\n"
      properties:
        income_tax:
          type: number
          format: float
          example: 797.27
        national_insurance:
          type: number
          format: float
          example: 259.75
        pension:
          type: number
          format: float
          example: 146.76
        student_loan:
          type: number
          format: float
          example: 0
        postgraduate_loan:
          type: number
          format: float
          example: 0
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/EstimatedPayDeductionItem'
        earnings_orders:
          type: array
          items:
            $ref: '#/components/schemas/EstimatedPayDeductionItem'
      required:
        - income_tax
        - national_insurance
        - pension
        - student_loan
        - postgraduate_loan
        - corrections
        - earnings_orders
    EstimatedPay:
      type: object
      properties:
        year:
          type: integer
          example: 2026
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 5
        month_label:
          type: string
          example: 'May 2026'
        hours:
          $ref: '#/components/schemas/EstimatedPayHoursOrSleeps'
        sleeps:
          $ref: '#/components/schemas/EstimatedPayHoursOrSleeps'
        enhancements:
          type: array
          items:
            $ref: '#/components/schemas/EstimatedPayEnhancement'
        grand_total:
          type: object
          description: 'Gross totals across hours, sleeps, and enhancements.'
          properties:
            total_value:
              type: number
              format: float
              example: 178.75
            total_cost:
              type: number
              format: float
              example: 4612.45
          required:
            - total_value
            - total_cost
        gross_pay:
          type: number
          format: float
          nullable: true
          description: "Gross pay for the month in £. Mirrors `grand_total.total_cost` when\nsourced from the engine; pulled from `payslips.total_gross` when a\npayslip already exists. `null` when no tax code is configured.\n"
          example: 4612.45
        net_pay:
          type: number
          format: float
          nullable: true
          description: "Take-home pay in £ after deductions. `null` when no tax code is\nconfigured.\n"
          example: 3408.67
        deductions_total:
          type: number
          format: float
          nullable: true
          description: "Sum of all deductions in £ (statutory + corrections + earnings\norders). `null` when no tax code is configured.\n"
          example: 1203.78
        deductions:
          allOf:
            -
              $ref: '#/components/schemas/EstimatedPayDeductions'
          nullable: true
      required:
        - year
        - month
        - month_label
        - hours
        - sleeps
        - enhancements
        - grand_total
