  /oauth/dashboard:
    get:
      operationId: getDashboard
      summary: 'Get the dashboard layout'
      description: "Retrieve the registered widgets and quick links for the team the token\nwas issued for.\n\nOnly the widgets the web dashboard would show this user are returned:\nwidgets are left out when the team's plan lacks the feature they need,\nthe team has switched their optional module off, the user's role should\nnot see them (including former PAs), or their display condition is not\nmet. They come back sorted by priority. Each entry gives the component\nname, the zone it belongs in, how wide it renders and its priority\nwithin the zone — enough to lay out the screen before any widget\ncontent has loaded.\n\nQuick links are the shortcuts under the dashboard. They are resolved\nfor the token's team, so the URLs are already tenant-correct. An empty\narray means there is no tenant context on the token.\n\n**Authorization:** Requires the `dashboard:read` scope.\n"
      tags:
        - Dashboard
      security:
        -
          oauth2:
            - 'dashboard:read'
      responses:
        200:
          description: 'Dashboard layout retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { widgets: { type: array, items: { $ref: '#/components/schemas/DashboardWidget' } }, quick_links: { type: array, items: { $ref: '#/components/schemas/DashboardQuickLink' } } } }, meta: { type: object, properties: { team_id: { type: integer, nullable: true } } } } }
              example: { data: { widgets: [{ component: today-rota-widget, zone: primary, width: full, priority: 10 }, { component: appointments-widget, zone: secondary, width: half, priority: 20 }], quick_links: [{ label: 'Book leave', description: 'Request time off', icon: calendar-days, color: blue, url: 'https://acme.support-manager.co.uk/leave/request' }] }, meta: { team_id: 1 } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          description: 'The token does not carry the `dashboard:read` scope'
        500:
          $ref: '#/components/responses/ServerError'
