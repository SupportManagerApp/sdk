          properties:
            team_id:
              type: integer
    CreateShiftInput:
      type: object
      required:
        - assignee_id
        - date
        - start_time
      properties:
        assignee_id:
          type: integer
          description: "The user to roster. Must be a member of the team in `X-Team-ID`.\n"
          example: 12
        date:
          type: string
          format: date
          example: '2026-08-17'
        start_time:
          type: string
          description: 'HH:MM, 24-hour.'
          example: '09:00'
        end_time:
          type: string
          nullable: true
          description: "HH:MM, 24-hour. Optional — an hour after `start_time` is assumed when\nomitted. At or before the start, the shift is taken to run overnight.\n"
          example: '17:00'
        notes:
          type: string
          nullable: true
          maxLength: 500
          example: 'covering for Jane'
        is_sleeping_night:
          type: boolean
          default: false
          description: 'Creates a sleeping-night entry rather than overtime hours.'
          example: false
        is_private:
          type: boolean
          default: false
          example: false
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          example:
            - training
    BankHoliday:
      type: object
      properties:
        date:
          type: string
          format: date
