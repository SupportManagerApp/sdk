              example: { data: { id: '1', type: users, attributes: { title: MR, name: 'John Doe', email: john@example.com, avatar: 'https://...', mobile_number: '+44 7700 900000', date_of_birth: '1990-05-15', gender: male, ni_number: AB123456C, show_birthday_on_roster: true, is_view_only: false, address: { id: '1', type: addresses, attributes: { address_line_one: '123 Main Street', address_line_two: 'Flat 4', address_line_three: null, town: London, county: 'Greater London', postcode: 'SW1A 1AA' } }, emergency_contacts: [{ id: '1', type: emergency_contacts, attributes: { name: 'Jane Doe', relationship: Spouse, phone_number: '+44 7700 900001' } }], teams: [{ id: 1, name: 'Team Alpha', role: PA }], has_second_factor: true, created_at: '2023-01-15T10:00:00Z' } } }
