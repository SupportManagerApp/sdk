              type: object
              required: [start_date, end_date, type]
              properties: { start_date: { type: string, description: 'First day off for `Whole Days` (YYYY-MM-DD); start date and time for `Custom Timings`', example: '2024-03-15' }, end_date: { type: string, description: 'Last day off for `Whole Days` (YYYY-MM-DD); end date and time for `Custom Timings`', example: '2024-03-22' }, type: { type: string, enum: ['Whole Days', 'Custom Timings'], description: 'Type of holiday request', example: 'Whole Days' }, requester_comments: { type: string, maxLength: 1000, nullable: true, description: 'Optional comments from the requester', example: 'Family holiday to Spain' } }
            example:
              start_date: '2024-03-15'
              end_date: '2024-03-22'
              type: 'Whole Days'
              requester_comments: 'Family holiday to Spain'
      responses:
        201:
          description: 'Holiday request created successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/HolidayRequest' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/HolidayValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  '/leave/requests/{id}':
    get:
