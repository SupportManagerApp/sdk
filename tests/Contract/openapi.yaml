  /rota/shifts/upcoming:
    get:
      operationId: getUpcomingShifts
      summary: 'List the shifts still to come'
      description: "Retrieve the shifts still to come within a short window, ordered by\nstart time. Built for glanceable clients — a watch face, a lock-screen\nwidget — which get one shot at a payload.\n\nUnlike `/rota/shifts`:\n\n- **The response is never paginated.** `limit` bounds it, and the whole\n  answer is in the one body. There are no `links`, and `meta` carries no\n  page counters.\n- **Every entry is a shift.** Holiday types (annual leave, sickness,\n  unpaid leave) are excluded, so a client does not have to discriminate\n  on `type` to avoid rendering leave as a working day. Use\n  `/rota/shifts` if you want leave blocks alongside shifts.\n- **The server decides the window.** You pass a number of days, not a\n  date, so a client never has to work out what \"today\" means in the\n  team's timezone. The window it settled on comes back in `meta`.\n\nA shift counts as upcoming while it is still running, so the one you are\ncurrently on does not vanish halfway through. Shifts that have already\nended are excluded. Unpublished shifts are always excluded.\n\n**Authorization:** All authenticated team members. `mode` decides whose\nshifts come back, and `scheduled` is the default — the common case for\nthis endpoint is \"what am I doing next\".\n"
      tags:
        - Shifts
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
        -
          name: days
          in: query
          description: "Size of the window in days, counted from the start of today. `2`\nmeans today and tomorrow. Values outside the range are clamped\nrather than rejected.\n"
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 2
          example: 2
        -
          name: limit
          in: query
          description: "Maximum number of shifts to return. Values outside the range are\nclamped rather than rejected.\n"
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10
        -
          name: mode
          in: query
          description: "Whose shifts to return. Unrecognised values fall back to\n`scheduled`.\n\n- `scheduled` — the authenticated user's own shifts (default)\n- `team` — every published shift for the team, less other\n  people's private shifts unless the caller is privileged\n  (Admin/Manager) or a family member, as on the web calendar\n- `available` — shifts open for application or with nobody\n  assigned yet, as on the web calendar's available view\n"
          schema:
            type: string
            enum:
              - scheduled
              - team
              - available
            default: scheduled
          example: scheduled
      responses:
        200:
          description: 'Upcoming shifts retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/RotaEntry' } }, meta: { type: object, properties: { team_id: { type: integer }, mode: { type: string, description: "The mode actually used, after falling back to\n`scheduled` for an unrecognised value.\n", example: scheduled }, days: { type: integer, description: 'The window size actually used, after clamping.' }, limit: { type: integer, description: 'The limit actually used, after clamping.' }, window_start: { type: string, format: date-time, description: "The moment the window opens — the time of the request.\n" }, window_end: { type: string, format: date-time, description: "The end of the last day in the window.\n" } } } } }
              example: { data: [{ id: '42', type: rota_entries, attributes: { team_id: 1, user_id: 5, start: '2024-08-13T09:00:00+01:00', end: '2024-08-13T17:00:00+01:00', type: 'Contracted Hours', type_label: 'Contracted Hours', duration: 8.0, is_published: true } }], meta: { team_id: 1, mode: scheduled, days: 2, limit: 10, window_start: '2024-08-13T07:32:11+01:00', window_end: '2024-08-14T23:59:59+01:00' } }
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
  '/rota/shifts/{id}':
    get:
      operationId: getShift
      summary: 'Get shift details'
      description: "Retrieve details of a specific shift.\n\n**Authorization:**\n- Users can view their own shifts\n- Privileged users can view any published shift\n- Private shifts are only visible to the owner or privileged users\n"
      tags:
        - Shifts
      security:
        -
          sanctum: {}
      parameters:
        -
          name: id
          in: path
          required: true
          description: 'Shift (rota entry) ID'
          schema:
            type: integer
          example: 1
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Shift retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/RotaEntry' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/ServerError'
  '/rota/shifts/{id}/amendment-requests':
    post:
      operationId: requestShiftAmendment
      summary: 'Ask for a change to one of your shifts'
      description: "Ask the managers to change the times, pay enhancement or tags of a\nshift you are on. The managers are notified and approve or reject it\non the web.\n\n**Authorization:** the shift must be yours, it must not already have a\npending amendment request, and you must not be privileged (Admins and\nManagers edit shifts directly). Anything else gets a 403. Show the\nbutton when the shift's `meta.can.request_amendment` is true.\nNeeds a token with the `access` ability.\n\nThe proposed times are placed on the day the shift starts; an end at\nor before the start runs into the next morning.\n"
      tags:
        - 'Shift Amendments'
      security:
        -
          sanctum: {}
      parameters:
        -
          name: id
          in: path
          required: true
          description: 'Shift (rota entry) ID'
          schema:
            type: integer
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotaCreateShiftAmendmentInput'
      responses:
        201:
          description: 'Amendment request submitted'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/RotaShiftAmendmentRequest' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/RotaValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  '/rota/shifts/{id}/apply':
    post:
      operationId: applyForShift
      summary: 'Apply for an available shift'
      description: "Submit an application for an available shift.\n\n**Authorization:** shift workers (Manager, PA, Contractor) only, as on\nthe web. Anybody else, family members and admins included, gets a 403.\nNeeds a token with the `access` ability; a refresh token gets a 403.\n\n**Requirements:**\n- Shift must be published\n- Shift must be marked as available\n- Shift must not be assigned to a user\n- User must pass eligibility checks (phase restrictions, etc.)\n- The shift must not be a segment of a sleepover. A sleepover is\n  applied for as a whole through\n  `POST /rota/shift-blocks/{id}/application`, so a segment is\n  rejected here with a 422.\n\nSupports both full-shift and partial (split) applications. Each call\napplies for the one shift in the path; apply for each shift separately.\n"
      tags:
        - 'Shift Applications'
      security:
        -
          sanctum: {}
      parameters:
        -
          name: id
          in: path
          required: true
          description: 'Shift (rota entry) ID'
          schema:
            type: integer
          example: 10
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyForShiftRequest'
            examples:
              full_shift: { summary: 'Apply for the full shift', value: { is_split_application: false } }
              split_shift: { summary: 'Apply for part of the shift', value: { is_split_application: true, proposed_start_time: '09:00', proposed_end_time: '13:00' } }
      responses:
        201:
          description: 'Application submitted successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ShiftApplication' } }, message: { type: string, example: 'Your application has been submitted for review.' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/RotaValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  /signing/requests:
    get:
      operationId: getSignatureRequests
      summary: 'List signature requests'
      description: "Lists the authenticated user's own signature requests in the current team.\n\nBy default this is the inbox: documents still out for signing that the user has not signed yet,\noldest first. Pass `status=signed` for the documents the user has already signed, most recently\nsigned first.\n\nFields and the consent statement are only included when fetching a single request.\n\n**Authorization:** Any team member. Only the user's own requests are listed, whatever their role.\n"
      tags:
        - E-signing
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/SigningTeamId'
        -
          name: status
          in: query
          description: 'Which requests to list.'
          schema:
            type: string
            enum:
              - awaiting
              - signed
            default: awaiting
      responses:
        200:
          description: 'Signature requests retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/SigningRequest' } } } }
              example: { data: [{ id: '12', type: signature-requests, attributes: { document: { name: 'Working pattern change', status: sent, sent_at: '2026-10-30T09:15:00.000000Z', completed_at: null }, name: 'Jane Smith', email: jane@example.com, role: null, sent_at: '2026-10-30T09:15:00.000000Z', viewed_at: null, signed_at: null, signed_via: null }, meta: { can: { sign: true, download_signed: false } } }] }
        401:
          $ref: '#/components/responses/SigningUnauthorized'
        403:
          $ref: '#/components/responses/SigningForbidden'
        404:
          $ref: '#/components/responses/SigningNotFound'
        422:
          $ref: '#/components/responses/SigningValidationFailed'
        500:
          $ref: '#/components/responses/ServerError'
  '/signing/requests/{id}':
    get:
      operationId: getSignatureRequest
      summary: 'Get a signature request'
      description: "Returns everything needed to fill in and sign the document: its name and status, the user's own\nprogress, the fields they can see, and the exact statement they agree to when signing.\n\nThe first time the recipient fetches a request, `viewed_at` is set.\n\n**Authorization:** Only the recipient themselves, while the document is out for signing or after it\nhas been completed or voided. Requests for documents the sender has recalled return 403.\nRequests belonging to another team return 404.\n"
      tags:
        - E-signing
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/SigningRequestId'
        -
          $ref: '#/components/parameters/SigningTeamId'
      responses:
        200:
          description: 'Signature request retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/SigningRequestWithFields' } } }
              example: { data: { id: '12', type: signature-requests, attributes: { document: { name: 'Working pattern change', status: sent, sent_at: '2026-10-30T09:15:00.000000Z', completed_at: null }, name: 'Jane Smith', email: jane@example.com, role: null, sent_at: '2026-10-30T09:15:00.000000Z', viewed_at: '2026-10-31T08:02:11.000000Z', signed_at: null, signed_via: null, fields: [{ id: 6f1c2a52-8e8e-4d3c-9a7e-0c2b3f1d5e10, type: signature, is_mine: true, is_required: true, page: 1, x: 0.12, 'y': 0.81, width: 0.3, height: 0.06, value: null }], consent_statement: 'I agree to sign this document electronically. I intend my electronic signature, and everything else I have filled in, to have the same effect as if I had signed a paper copy by hand.' }, meta: { can: { sign: true, download_signed: false } } } }
        401:
          $ref: '#/components/responses/SigningUnauthorized'
        403:
          $ref: '#/components/responses/SigningForbidden'
        404:
          $ref: '#/components/responses/SigningNotFound'
        500:
          $ref: '#/components/responses/ServerError'
  '/signing/requests/{id}/file':
    get:
      operationId: getSignatureRequestFile
      summary: 'Download the document to sign'
      description: "Streams the original PDF, as sent, without anything filled in. Draw the fields over it using their\npage and position.\n\n**Authorization:** As for getting the signature request.\n"
      tags:
        - E-signing
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/SigningRequestId'
        -
          $ref: '#/components/parameters/SigningTeamId'
      responses:
        200:
          description: 'The original PDF'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        401:
          $ref: '#/components/responses/SigningUnauthorized'
        403:
          $ref: '#/components/responses/SigningForbidden'
        404:
          $ref: '#/components/responses/SigningNotFound'
        500:
          $ref: '#/components/responses/ServerError'
  '/signing/requests/{id}/sign':
    post:
      operationId: signSignatureRequest
      summary: Sign
      description: "Signs the document using the values already saved. Show the user `consent_statement` and send\n`agrees_to_sign_electronically: true` once they agree to it.\n\nThe signature is recorded with the request's IP address and user agent, and as signed through the\napp. When the user is the last to sign, the document is completed and everyone is emailed the\nsigned copy.\n\n**Authorization:** Only the recipient, while the document is out for signing and before they have\nsigned (`meta.can.sign`).\n"
      tags:
        - E-signing
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/SigningRequestId'
        -
          $ref: '#/components/parameters/SigningTeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agrees_to_sign_electronically]
              properties: { agrees_to_sign_electronically: { type: boolean } }
            example:
              agrees_to_sign_electronically: true
      responses:
        200:
          description: 'Signed. Returns the updated signature request.'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/SigningRequestWithFields' } } }
        401:
          $ref: '#/components/responses/SigningUnauthorized'
        403:
          $ref: '#/components/responses/SigningForbidden'
        404:
          $ref: '#/components/responses/SigningNotFound'
        422:
          description: "Not signed. Errors are keyed by field `id` for fields that are missing or invalid, by `consent`\nwhen `agrees_to_sign_electronically` is false, and by `agrees_to_sign_electronically` when it is\nmissing.\n"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningValidationErrors' }
              example: { message: 'Please fill in this field.', errors: { 6f1c2a52-8e8e-4d3c-9a7e-0c2b3f1d5e10: ['Please fill in this field.'] } }
        500:
          $ref: '#/components/responses/ServerError'
  '/signing/requests/{id}/signed':
    get:
      operationId: downloadSignedCopy
      summary: 'Get signed copy download URL'
      description: "Get a temporary URL for downloading the signed copy, with the signing certificate attached.\nThe URL expires after 5 minutes.\n\n**Authorization:** Only the recipient, once the document has been completed. A completed document\nthe sender has since voided can still be downloaded (`meta.can.download_signed`).\n"
      tags:
        - E-signing
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/SigningRequestId'
        -
          $ref: '#/components/parameters/SigningTeamId'
      responses:
        200:
          description: 'Download URL generated successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { download_url: { type: string, format: uri, description: 'Temporary signed URL for downloading the signed copy' }, filename: { type: string, example: 'Working pattern change (signed).pdf' }, expires_at: { type: string, format: date-time, description: 'When the download URL expires' } } } } }
              example: { data: { download_url: 'https://bucket.s3.amazonaws.com/signing/1/signed/file.pdf?X-Amz-Expires=300&X-Amz-Signature=...', filename: 'Working pattern change (signed).pdf', expires_at: '2026-10-31T14:35:00.000000Z' } }
        401:
          $ref: '#/components/responses/SigningUnauthorized'
        403:
          $ref: '#/components/responses/SigningForbidden'
        404:
          $ref: '#/components/responses/SigningNotFound'
        500:
          $ref: '#/components/responses/ServerError'
  '/signing/requests/{id}/values':
    put:
      operationId: saveSignatureRequestValues
      summary: 'Save field values'
      description: "Saves what the recipient has filled in so far, keyed by field `id`. Send only the fields that have\nchanged; `null` clears a field. Ids of fields belonging to someone else are ignored.\n\nValues are checked against the field's type: `signature` and `initials` take a\n`data:image/png;base64,` image of up to 400 KB, `date` takes `YYYY-MM-DD`, `checkbox` takes `\"1\"`\nwhen ticked, `text` takes up to 1000 characters and the other types up to 255. Whether required\nfields are filled in is only checked when signing.\n\n**Authorization:** Only the recipient, while the document is out for signing and before they have\nsigned (`meta.can.sign`).\n"
      tags:
        - E-signing
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/SigningRequestId'
        -
          $ref: '#/components/parameters/SigningTeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string, nullable: true }
            example:
              6f1c2a52-8e8e-4d3c-9a7e-0c2b3f1d5e10: 'data:image/png;base64,iVBORw0KGgo...'
              0b9d7e44-2f61-4c55-8a1e-7d3e9f6a2b01: '2026-10-31'
      responses:
        204:
          description: 'Values saved'
        401:
          $ref: '#/components/responses/SigningUnauthorized'
        403:
          $ref: '#/components/responses/SigningForbidden'
        404:
          $ref: '#/components/responses/SigningNotFound'
        422:
          description: 'A value is not valid for its field. Errors are keyed by field `id`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningValidationErrors' }
              example: { message: 'The 6f1c2a52-8e8e-4d3c-9a7e-0c2b3f1d5e10 field must start with one of the following: data:image/png;base64,.', errors: { 6f1c2a52-8e8e-4d3c-9a7e-0c2b3f1d5e10: ['The 6f1c2a52-8e8e-4d3c-9a7e-0c2b3f1d5e10 field must start with one of the following: data:image/png;base64,.'] } }
        500:
          $ref: '#/components/responses/ServerError'
  /tasks:
    get:
      operationId: getTasks
      summary: 'List tasks'
      description: "Retrieve all tasks visible to the authenticated user.\n\nTasks are filtered based on the user's role:\n- Employee tasks are shown to all authenticated users\n- Manager-only tasks are hidden from non-privileged users\n\nTasks are sorted by priority and filtered by dependencies and display conditions.\n\n**Authorization:** Employees (managers and PAs) and privileged users (admins\nand managers) only. Family members, contractors and former PAs receive `403`,\nmatching the web to-do list.\n"
      tags:
        - Tasks
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
        -
          name: completed
          in: query
          description: 'Filter by completion status'
          schema:
            type: boolean
          example: false
        -
          name: completion_role
          in: query
          description: 'Filter by completion role'
          schema:
            type: string
            enum:
              - self
              - manager
              - both
          example: self
      responses:
        200:
          description: 'Tasks retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Task' } }, meta: { type: object, properties: { team_id: { type: integer } } } } }
              example: { data: [{ key: profile.address, label: 'Home Address', description: 'Provide your current home address for correspondence and tax purposes', icon: home, completed: false, completion_role: both, completion_role_label: 'Employee or Manager', priority: 100 }, { key: profile.emergency_contact, label: 'Emergency Contact', description: 'Add an emergency contact person', icon: phone, completed: true, completion_role: self, completion_role_label: 'Employee Only', priority: 200 }], meta: { team_id: 1 } }
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
  /tasks/count:
    get:
      operationId: getTaskCount
      summary: 'Get task badge count'
      description: "Get the count of incomplete tasks for sidebar badge display.\n\nReturns separate counts for:\n- **my_tasks**: User's own incomplete tasks\n- **manager_inbox**: Pending manager-only tasks (privileged users only)\n- **count**: Total of both (for badge display)\n\n**Authorization:** Employees (managers and PAs) and privileged users (admins\nand managers) only. Family members, contractors and former PAs receive `403`,\nmatching the web to-do list.\n"
      tags:
        - Tasks
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Task count retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/TaskCount' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
              example: { data: { count: 5, my_tasks: 3, manager_inbox: 2 }, meta: { team_id: 1 } }
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
  /tasks/manager-inbox:
    get:
      operationId: getManagerInbox
      summary: 'Get manager inbox'
      description: "Get employees with pending manager-only tasks.\n\n**Authorization:** Privileged users only (Admin/Manager)\n\nReturns a list of employees who have incomplete tasks that can only be completed by a manager.\n"
      tags:
        - Tasks
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Manager inbox retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/EmployeePendingTasks' } }, meta: { type: object, properties: { team_id: { type: integer }, total_pending: { type: integer, description: 'Total number of pending manager tasks across all employees' } } } } }
              example: { data: [{ user: { id: 5, name: 'Jane Smith' }, pending_tasks: [{ key: compliance.dbs_check_review, label: 'DBS Check Review', description: 'Review the DBS certificate and record the result', icon: clipboard-document-check, completed: false, completion_role: manager, completion_role_label: 'Manager Only', priority: 65 }] }], meta: { team_id: 1, total_pending: 3 } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
  /tasks/progress:
    get:
      operationId: getTaskProgress
      summary: 'Get task completion progress'
      description: "Get the task completion percentage for the authenticated user.\n\nReturns:\n- **percentage**: Completion percentage (0-100)\n- **completed**: Number of completed tasks\n- **total**: Total number of visible tasks\n\nReturns 100% if no tasks are visible.\n\n**Authorization:** Employees (managers and PAs) and privileged users (admins\nand managers) only. Family members, contractors and former PAs receive `403`,\nmatching the web to-do list.\n"
      tags:
        - Tasks
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Task progress retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/TaskProgress' }, meta: { type: object, properties: { team_id: { type: integer } } } } }
              example: { data: { percentage: 75, completed: 3, total: 4 }, meta: { team_id: 1 } }
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
  /tasks/team-progress:
    get:
      operationId: getTeamProgress
      summary: 'Get team task progress'
      description: "Get task progress for all active employees in the team.\n\n**Authorization:** Privileged users only (Admin/Manager)\n\nReturns each employee's completion percentage and list of incomplete tasks.\n"
      tags:
        - Tasks
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Team progress retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/EmployeeTaskProgress' } }, meta: { type: object, properties: { team_id: { type: integer } } } } }
              example: { data: [{ user: { id: 5, name: 'Jane Smith' }, percentage: 75, incomplete_tasks: [{ key: profile.address, label: 'Home Address', description: 'Provide your current home address', icon: home, completed: false, completion_role: both, completion_role_label: 'Employee or Manager', priority: 100 }] }, { user: { id: 6, name: 'John Doe' }, percentage: 100, incomplete_tasks: {} }], meta: { team_id: 1 } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/InvalidTeam'
        500:
          $ref: '#/components/responses/ServerError'
  '/tasks/{taskKey}/complete':
    post:
      operationId: completeTask
      summary: 'Mark task as complete'
      description: "Trigger task completion cache refresh for a specific task.\n\nThe task key uses dot notation (e.g., `profile.address`).\n\n**Authorization:**\n- Self-only tasks: Only the user themselves can complete\n- Manager-only tasks: Only privileged users can complete\n- Both: Either the user or a privileged user can complete\n\nIf `user_id` is provided, the task is completed for that user (requires privileged access).\nThe user must be a member of the current team; any other `user_id` is rejected with `422`.\n\n**Note:** This endpoint clears the task badge cache. The actual task completion\nhappens through domain-specific endpoints (e.g., saving an address form).\n"
      tags:
        - Tasks
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
        -
          name: taskKey
          in: path
          required: true
          description: 'Task key using dot notation'
          schema:
            type: string
            pattern: '^[a-z._]+$'
          example: profile.address
      requestBody:
        description: 'Optional user ID to complete task for another user (privileged only)'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { user_id: { type: integer, description: 'User ID to complete task for (privileged users only). Must be a member of the current team.', example: 5 } }
      responses:
        200:
          description: "Task cache cleared successfully.\n\nThe `data` payload contains the full task resource when the task is\nstill visible to the target user. If the completed task is no longer\nin the user's visible list (for example, it was filtered out by a\ndisplay condition after completion), a minimal fallback payload is\nreturned containing only `key` and `completed`.\n"
          content:
            application/json:
              schema: { anyOf: [{ type: object, description: 'Full task resource (task still visible)', properties: { message: { type: string }, data: { $ref: '#/components/schemas/Task' }, meta: { type: object, properties: { team_id: { type: integer } } } } }, { type: object, description: 'Fallback payload (task no longer visible)', properties: { message: { type: string }, data: { type: object, properties: { key: { type: string, example: profile.address }, completed: { type: boolean, example: true } } }, meta: { type: object, properties: { team_id: { type: integer } } } } }] }
              examples: { full: { summary: 'Task still visible to user', value: { message: 'Task cache cleared successfully.', data: { key: profile.address, label: 'Home Address', description: 'Provide your current home address', icon: home, completed: true, completion_role: both, completion_role_label: 'Employee or Manager', priority: 100 }, meta: { team_id: 1 } } }, fallback: { summary: 'Task no longer in visible list', value: { message: 'Task cache cleared successfully.', data: { key: profile.address, completed: true }, meta: { team_id: 1 } } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          description: 'The task key was not found in the registry.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'Task not found.' }
        422:
          description: "Either the team context is invalid or missing, or the supplied\n`user_id` is not a member of the current team.\n"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples: { invalidTeam: { summary: 'Invalid or missing team', value: { message: 'Invalid or missing team. Please specify a valid team ID via X-Team-ID header or team_id parameter.' } }, userNotInTeam: { summary: 'Supplied user_id is not a member of the team', value: { message: 'The specified user is not a member of this team.', errors: { user_id: ['The specified user is not a member of this team.'] } } } }
        500:
          $ref: '#/components/responses/ServerError'
  /user:
