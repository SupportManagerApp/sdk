          description: "UK region this holiday applies to\n\nKnown values: `england-and-wales`, `scotland`, `northern-ireland`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
          example: england-and-wales
    Birthday:
