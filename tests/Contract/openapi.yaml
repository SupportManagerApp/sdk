    ParseQuickAddInput:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 2
          maxLength: 8000
          description: "The text to parse — a phrase as dictated or typed, or the body of a\npasted appointment letter or confirmation email.\n"
          example: 'dentist tuesday half three'
        timezone:
          type: string
          nullable: true
          description: "IANA timezone the phrase should be resolved against — \"half three\"\nnames no instant without one. Defaults to the platform's own zone\nwhen omitted.\n"
          example: Europe/London
    QuickAddParseState:
      type: object
      description: "The state of a parse. `result` is present only when `status` is\n`completed`; `hint` only when it is `failed`.\n"
      properties:
        status:
          type: string
          description: "Known values: `pending` (keep polling), `completed` (`result` is\npopulated), `failed` (`hint` explains what to tell the user). This\nlist is open and may grow — clients must ignore values they do not\nrecognise rather than failing to decode the response.\n"
          example: completed
        result:
          $ref: '#/components/schemas/QuickAddParseResult'
        hint:
          type: string
          nullable: true
          description: "A sentence to show the user when the parse failed. Quick add is a\nconvenience over a form, so this is a nudge towards filling the\nfields in by hand, not an error.\n"
          example: "We couldn't read that. Try again, or enter the details yourself."
    QuickAddParseResult:
      type: object
      nullable: true
      description: "What the parser understood. **Nothing has been created.** Render this for\nthe user to confirm, then send it to `POST /rota/appointments` or\n`POST /rota/shifts`.\n\nEvery field is always present. Which ones are meaningful depends on\n`intent`: appointment fields are null on a shift, and shift fields are\nnull or false on an appointment.\n"
      properties:
        intent:
          type: string
          description: "What the text describes, and therefore which create endpoint the\nconfirmed result belongs to.\n\nKnown values: `appointment` (a personal calendar event →\n`POST /rota/appointments`), `shift` (a work shift for a named\nemployee → `POST /rota/shifts`). This list is open and may grow —\nclients must ignore values they do not recognise rather than failing\nto decode the response.\n"
          example: appointment
        title:
          type: string
          nullable: true
          description: "Appointment subject, with date, time and location noise stripped.\nNull for shifts.\n"
          example: Dentist
        assignee_name:
          type: string
          nullable: true
          description: "The employee's name exactly as the user said it (shifts only). Null\nfor appointments, and null when no name was given. Use `assignee_id`\nfor the resolved user.\n"
          example: Sarah
        assignee_id:
          type: integer
          nullable: true
          description: "`assignee_name` resolved against the team's active employees,\nserver-side. Null when no name was given, when nothing matched, or\nwhen the match was too close to call — in which case\n`assignee_candidates` holds what to offer the user.\n"
          example: 12
        assignee_candidates:
          type: array
          description: "Possible matches for an ambiguous `assignee_name`, best first, at\nmost five. Empty when `assignee_id` is settled or nothing matched.\nPresent so a client can ask \"which Sarah?\" rather than guessing.\n"
          items:
            type: object
            properties:
              id: { type: integer, example: 12 }
              name: { type: string, example: 'Sarah Jones' }
              score: { type: number, format: float, description: 'Match strength, 0.0–1.0.', example: 0.82 }
        date:
          type: string
          format: date
          nullable: true
          description: "Start date (YYYY-MM-DD), resolved against the device's timezone.\nNull when the text named no date — the client should ask.\n"
          example: '2026-08-18'
        end_date:
          type: string
          format: date
          nullable: true
          description: "End date of a multi-day all-day event (\"12-19 August\"). Null for\neverything else, including single-day all-day events.\n"
          example: null
        start_time:
          type: string
          nullable: true
          description: "Start time as HH:MM, 24-hour. Null for all-day events and when no\ntime was given.\n"
          example: '15:30'
        end_time:
          type: string
          nullable: true
          description: "End time as HH:MM, 24-hour. Frequently null — the parser only sets it\nwhen the text implies a duration or an end. Where it is null, use\n`duration_minutes` to work one out.\n"
          example: null
        duration_minutes:
          type: integer
          nullable: true
          description: "How long the appointment is judged to run, in minutes, when the text\nnamed no end — a blood test is not a dentist is not a pre-op\nassessment. Null when `end_time` is set, for all-day events, and for\nshifts. Pass it to the create endpoint, which ends the appointment\nthat many minutes after the start; without it the endpoint assumes\nan hour.\n"
          example: 30
        location:
          type: string
          nullable: true
          description: 'Physical venue or address (appointments only). Null for shifts.'
          example: '12 High Street'
        is_virtual:
          type: boolean
          description: "True for an online or remote appointment (Zoom, Teams, \"video call\").\nAlways false for shifts and for all-day events.\n"
          example: false
        is_all_day:
          type: boolean
          description: "True for a full-day or multi-day appointment with no specific times,\nin which case `start_time` and `end_time` are null. Always false for\nshifts.\n"
          example: false
        is_sleeping_night:
          type: boolean
          description: "True when the shift is a sleeping night or sleepover, which decides\nthe entry's type. Always false for appointments.\n"
          example: false
        is_private:
          type: boolean
          description: "True when the shift was described as private, confidential or hidden.\nAlways false for appointments.\n"
          example: false
        tags:
          type: array
          description: "Tag names for a shift, preferring the team's existing tags where they\nmatch. Empty for appointments and when nothing tag-like was said.\n"
          items:
            type: string
          example:
            - training
        notes:
          type: string
          nullable: true
          description: "Whatever the user said beyond assignee, date, time and tags (shifts\nonly) — \"covering for Jane\", \"split shift\". Null for appointments.\n"
          example: 'covering for Jane'
        confidence:
          type: number
          format: float
          nullable: true
          description: "The parser's confidence in the whole parse, including `intent`, from\n0.0 to 1.0. Below about 0.5 the client should make the confirmation\nstep deliberate rather than a single tap.\n"
          example: 0.95
    CreateAppointmentInput:
      type: object
      required:
        - title
        - date
      properties:
        title:
          type: string
          maxLength: 255
          example: Dentist
        date:
          type: string
          format: date
          description: 'Start date (YYYY-MM-DD).'
          example: '2026-08-18'
        end_date:
          type: string
          format: date
          nullable: true
          description: "End date for a multi-day all-day appointment. Must not precede\n`date`. Ignored unless `is_all_day` is true.\n"
          example: null
        start_time:
          type: string
          nullable: true
          description: "HH:MM, 24-hour. Required unless `is_all_day` is true.\n"
          example: '15:30'
        end_time:
          type: string
          nullable: true
          description: "HH:MM, 24-hour. Optional — `duration_minutes` after `start_time`, or\nan hour, is assumed when omitted. At or before the start, the\nappointment is taken to run past midnight.\n"
          example: '16:00'
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 480
          description: "How long the appointment runs, used only when `end_time` is omitted.\nPass through what the parse judged so a 15-minute blood test does not\nblock out an hour.\n"
          example: 30
        location:
          type: string
          nullable: true
          maxLength: 500
          example: '12 High Street'
        notes:
          type: string
          nullable: true
          maxLength: 2000
          description: "Practical detail worth keeping — what to bring, arrival instructions,\nbooking references. Filled from a parsed appointment letter.\n"
          example: 'Arrive 15 minutes early. Bring a list of current medication.'
        is_virtual:
          type: boolean
          default: false
          example: false
        is_all_day:
          type: boolean
          default: false
          example: false
        is_private:
          type: boolean
          default: false
          description: "Restrict the appointment to its creator, the users in `viewer_ids`,\nand privileged users (Admin/Manager).\n"
          example: false
        viewer_ids:
          type: array
          items:
            type: integer
          description: "IDs of the users who may also see a private appointment. Ignored\nunless `is_private` is true. Each must be a member of the team in\n`X-Team-ID`; anybody else is rejected with a 422. Offer colleagues\nfrom `GET /users/options`.\n"
          example:
            - 5
            - 8
    RotaUpdateAppointmentInput:
      type: object
      description: "The fields of `CreateAppointmentInput`, all optional. The when-fields\ntravel together: any of them requires `date`.\n"
      properties:
        title:
          type: string
          maxLength: 255
        date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        start_time:
          type: string
          nullable: true
          description: 'HH:MM, 24-hour. Required with `date` unless the appointment is or becomes all day.'
        end_time:
          type: string
          nullable: true
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 480
        location:
          type: string
          nullable: true
          maxLength: 500
        notes:
          type: string
          nullable: true
          maxLength: 2000
        is_virtual:
          type: boolean
        is_all_day:
          type: boolean
        is_private:
          type: boolean
        viewer_ids:
          type: array
          items:
            type: integer
          description: 'Replaces the named viewers. Ignored while the appointment is public.'
      example:
        date: '2026-08-25'
        start_time: '10:00'
        end_time: '10:30'
    RotaCreateShiftRequestInput:
      type: object
      required:
        - date
        - start_time
        - end_time
        - type
      properties:
        date:
          type: string
          format: date
          example: '2026-11-20'
        start_time:
          type: string
          description: 'HH:MM, 24-hour. Replaced with 23:00 for a sleeping night.'
          example: '09:00'
        end_time:
          type: string
          description: 'HH:MM, 24-hour. At or before the start, the shift runs into the next day. Replaced with 07:00 for a sleeping night.'
          example: '17:00'
        type:
          type: string
          enum:
            - 'Overtime Hours'
            - 'Overtime Sleeping Night'
          example: 'Overtime Hours'
        reason:
          type: string
          nullable: true
          maxLength: 1000
          example: 'Covering the late while Sam is away'
        requested_pay_enhancement_id:
          type: integer
          nullable: true
          description: 'A pay enhancement of the team in `X-Team-ID`.'
          example: null
    RotaShiftRequest:
      type: object
      properties:
        id:
          type: string
          example: '12'
        type:
          type: string
          example: shift_requests
        attributes:
          type: object
          properties:
            team_id:
              type: integer
            user_id:
              type: integer
            start:
              type: string
              format: date-time
              example: '2026-11-20T09:00:00+00:00'
            end:
              type: string
              format: date-time
              example: '2026-11-20T17:00:00+00:00'
            type:
              type: string
              example: 'Overtime Hours'
            type_label:
              type: string
              example: 'Overtime Hours'
            reason:
              type: string
              nullable: true
            requested_pay_enhancement_id:
              type: integer
              nullable: true
            status:
              type: string
              description: "Known values: `Pending`, `Approved`, `Rejected`. This list is open and may grow — clients must ignore values they do not recognise rather than failing to decode the response.\n"
              example: Pending
            reviewed_by:
              type: integer
              nullable: true
            reviewed_at:
              type: string
              format: date-time
              nullable: true
            rota_entry_id:
              type: integer
              nullable: true
              description: 'The shift created when the request was approved'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        meta:
          type: object
          properties:
            can:
              type: object
              properties: { delete: { type: boolean, description: 'Whether `DELETE /rota/shift-requests/{id}` is open to you' } }
    RotaCreateShiftAmendmentInput:
      type: object
      required:
        - proposed_start_time
        - proposed_end_time
      properties:
        proposed_start_time:
          type: string
          description: 'HH:MM, 24-hour, on the day the shift starts'
