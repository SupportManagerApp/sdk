  /notifications:
    get:
      operationId: listNotifications
      summary: 'List notifications'
      description: "Returns a paginated list of notifications for the authenticated user,\nmost recent first.\n\n**Response shape:** JSON:API envelope served as\n`application/json`. The collection lives under `data`; the\n`meta` object includes an `unread_count` field with the total number\nof unread notifications for the user (independent of the current\npage/filter).\n"
      tags:
        - Notifications
      security:
        -
          sanctum: {}
      parameters:
        -
          name: filter
          in: query
          required: false
          description: "Restrict the result set by read status. Omit to return all\nnotifications. Any value other than `read` or `unread` is ignored.\n"
          schema:
            type: string
            enum:
              - read
              - unread
        -
          name: per_page
          in: query
          required: false
          description: 'Number of notifications per page. Defaults to 15; values above 100 are capped at 100.'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        -
          name: page
          in: query
          required: false
          description: 'Page number to retrieve.'
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        200:
          description: 'Notifications retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationResource' } }, links: { type: object, description: 'JSON:API pagination links', additionalProperties: { type: string, nullable: true } }, meta: { type: object, properties: { unread_count: { type: integer, description: 'Total unread notifications for the user', example: 4 } }, additionalProperties: true } } }
              examples: { with_notifications: { summary: 'User with notifications', value: { data: [{ id: 9d8f1a2b-1c3d-4e5f-8a9b-1c2d3e4f5a6b, type: notifications, attributes: { type: SupportManager\Leave\Notifications\LeaveRequestApproved, data: { leave_request_id: 42, message: 'Your leave request has been approved.' }, read_at: null, created_at: '2026-05-20T09:15:00+00:00' } }, { id: 0e1f2a3b-4c5d-6e7f-8a9b-0c1d2e3f4a5b, type: notifications, attributes: { type: SupportManager\Rota\Notifications\Shifts\NewShiftAssignedNotification, data: { shift_id: 17 }, read_at: '2026-05-19T16:00:00+00:00', created_at: '2026-05-19T15:45:00+00:00' } }], meta: { unread_count: 4 } } }, empty: { summary: 'User with no notifications', value: { data: {}, meta: { unread_count: 0 } } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteAllNotifications
      summary: 'Delete all notifications'
      description: "Permanently deletes every notification for the authenticated user.\n\n**Response shape:** plain JSON (`application/json`), not JSON:API.\n"
      tags:
        - Notifications
      security:
        -
          sanctum: {}
      responses:
        200:
          description: 'All notifications deleted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationSuccess' }
              examples: { success: { summary: 'All notifications deleted', value: { success: true, message: 'All notifications deleted.' } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
