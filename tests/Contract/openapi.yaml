  /push-notifications/prompt/dismiss:
    post:
      operationId: dismissNotificationPrompt
      summary: 'Dismiss the notification setup prompt'
      description: "Marks the authenticated user as having dismissed the in-app\npush-notification setup prompt. After this is called,\n`GET /push-notifications/tokens/status` will return\n`prompt_dismissed: true` for this user.\n\nIdempotent — calling more than once simply refreshes the dismissed-at\ntimestamp.\n\n**Response shape:** plain JSON (`application/json`).\n"
      tags:
        - 'Push Notifications'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Prompt dismissed successfully'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushMutationSuccess' }
              examples: { success: { summary: 'Prompt dismissed', value: { success: true, message: 'Notification prompt dismissed.' } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
  /push-notifications/tokens:
    get:
      operationId: listDeviceTokens
      summary: 'List device tokens'
      description: "Returns all FCM device tokens registered by the authenticated user in\nthe current tenant, together with a `meta.count` field.\n\n**Response shape:** JSON:API envelope (`application/json`).\n"
      tags:
        - 'Push Notifications'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Device tokens retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/DeviceTokenResource' } }, meta: { type: object, properties: { count: { type: integer, description: 'Number of device tokens returned', example: 2 } } } } }
              examples: { with_tokens: { summary: 'User with registered tokens', value: { data: [{ id: '1', type: device_tokens, attributes: { token: fCM_token_abc123..., platform: ios, last_used_at: '2026-05-20T09:00:00+00:00', created_at: '2026-05-01T12:00:00+00:00', updated_at: '2026-05-20T09:00:00+00:00' } }, { id: '2', type: device_tokens, attributes: { token: fCM_token_xyz789..., platform: web, last_used_at: null, created_at: '2026-05-10T08:30:00+00:00', updated_at: '2026-05-10T08:30:00+00:00' } }], meta: { count: 2 } } }, no_tokens: { summary: 'User with no tokens', value: { data: {}, meta: { count: 0 } } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: storeDeviceToken
      summary: 'Register or refresh an FCM device token'
      description: "Registers a new FCM device token for the authenticated user in the\ncurrent tenant, or refreshes an existing one if the token is already\nknown (globally unique upsert).\n\nRe-registering an existing token moves the row to the current user and\nteam and bumps `last_used_at`. This is the correct behaviour when a\ndevice receives a new FCM token or when the user logs in on a new team.\n\n**Response shape:** JSON:API resource wrapped in a plain JSON envelope\nthat also includes `\"success\": true`. HTTP 201 on success.\n"
      tags:
        - 'Push Notifications'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties: { token: { type: string, maxLength: 512, description: 'The FCM registration token issued by the Firebase SDK', example: fCM_token_abc123... }, platform: { type: string, enum: [ios, android, web], description: 'Platform the device token was issued for', example: ios } }
            examples:
              ios_token: { summary: 'Register an iOS token', value: { token: fCM_token_abc123..., platform: ios } }
              web_token: { summary: 'Register a web token', value: { token: fCM_token_xyz789..., platform: web } }
      responses:
        201:
          description: 'Device token registered or refreshed successfully'
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean, example: true }, data: { $ref: '#/components/schemas/DeviceTokenResource' } } }
              examples: { success: { summary: 'Token registered', value: { success: true, data: { id: '1', type: device_tokens, attributes: { token: fCM_token_abc123..., platform: ios, last_used_at: '2026-05-23T10:00:00+00:00', created_at: '2026-05-01T12:00:00+00:00', updated_at: '2026-05-23T10:00:00+00:00' } } } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        422:
          $ref: '#/components/responses/PushNotificationValidationError'
        500:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteDeviceToken
      summary: 'Delete a specific device token'
      description: "Deletes the given FCM device token, but only if it belongs to the\nauthenticated user. Tokens owned by other users are silently ignored.\n\n**Response shape:** plain JSON (`application/json`).\n"
      tags:
        - 'Push Notifications'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string, description: 'The FCM registration token to remove', example: fCM_token_abc123... } }
            examples:
              remove_token: { summary: 'Remove a specific token', value: { token: fCM_token_abc123... } }
      responses:
        200:
          description: 'Token removed successfully'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushMutationSuccess' }
              examples: { success: { summary: 'Token removed', value: { success: true, message: 'Token removed.' } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        422:
          $ref: '#/components/responses/PushNotificationValidationError'
        500:
          $ref: '#/components/responses/ServerError'
  /push-notifications/tokens/all:
    delete:
      operationId: deleteAllDeviceTokens
      summary: 'Delete all device tokens'
      description: "Deletes every FCM device token registered by the authenticated user in\nthe current tenant. Useful on logout or when the user wants to\ncompletely disable push notifications.\n\n**Response shape:** plain JSON (`application/json`) with a\n`meta.removed_count` field indicating how many tokens were deleted.\n"
      tags:
        - 'Push Notifications'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'All tokens removed successfully'
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean, example: true }, message: { type: string, example: 'All tokens removed.' }, meta: { type: object, properties: { removed_count: { type: integer, description: 'Number of tokens that were removed', example: 3 } } } } }
              examples: { tokens_removed: { summary: 'Multiple tokens removed', value: { success: true, message: 'All tokens removed.', meta: { removed_count: 3 } } }, no_tokens: { summary: 'No tokens to remove', value: { success: true, message: 'All tokens removed.', meta: { removed_count: 0 } } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
  /push-notifications/tokens/status:
    get:
      operationId: getDeviceTokenStatus
      summary: 'Get push notification status'
      description: "Returns a lightweight status object for the authenticated user in the\ncurrent tenant: whether they have any registered tokens, the token\ncount, and whether they have dismissed the notification setup prompt.\n\nUseful for deciding whether to show a push-notification opt-in prompt\nin the UI.\n\n**Response shape:** plain JSON (`application/json`).\n"
      tags:
        - 'Push Notifications'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Status retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/DeviceTokenStatus' } } }
              examples: { has_tokens: { summary: 'User with registered tokens', value: { data: { has_tokens: true, token_count: 2, prompt_dismissed: false } } }, no_tokens: { summary: 'User with no tokens', value: { data: { has_tokens: false, token_count: 0, prompt_dismissed: false } } }, prompt_dismissed: { summary: 'User who dismissed the prompt', value: { data: { has_tokens: false, token_count: 0, prompt_dismissed: true } } } }
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'
  '/push-notifications/tokens/{id}':
    delete:
      operationId: deleteDeviceTokenById
      summary: 'Delete a device token by ID'
      description: "Deletes one of the authenticated user's device tokens in the current team,\nidentified by the `id` returned from `GET /push-notifications/tokens`. Use\nthis to sign out a device whose FCM token the client no longer holds.\n\nUnlike `DELETE /push-notifications/tokens`, an ID that does not name one of\nthe user's tokens returns `404` rather than succeeding silently.\n\n**Response shape:** plain JSON (`application/json`).\n"
      tags:
