      description: "Snooze a chore until the given date. The date and the user are recorded\nin `snoozed_at` and `snoozed_by`, separately from the chore's completion.\nThe `snoozed_until` date must be in the future.\n\nAny member of the team can snooze a chore until tomorrow, which marks it\nas checked and not needed today. Only privileged users (admins and\nmanagers) can snooze a chore beyond tomorrow; anyone else gets a 403.\n"
      tags:
