      description: "Mark several chores complete at once, by the authenticated user. Send either\n`chore_ids` or `group`, not both. `group` selects every chore of the team whose\nname matches once trimmed and lower-cased (a chore's `normalized_name`), as the\nweb app's \"Complete all instances\" does.\n\nAny team member may complete chores. If any chosen chore is refused, nothing is\nchanged and the response is a 403.\n"
