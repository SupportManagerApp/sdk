            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Team' } } } }
              examples: { success_response: { summary: 'Successful teams retrieval', value: { data: [{ id: '1', type: teams, attributes: { name: 'Development Team', slug: development-team, avatar_url: 'https://ui-avatars.com/api/?name=Development+Team&background=0ea5e9&color=fff&bold=true', role: PA } }, { id: '2', type: teams, attributes: { name: 'Marketing Team', slug: marketing-team, avatar_url: 'https://ui-avatars.com/api/?name=Marketing+Team&background=0ea5e9&color=fff&bold=true', role: Manager } }] } } }
        401:
          description: 'Authentication token is missing or invalid'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: Unauthenticated. } } }
        500:
          $ref: '#/components/responses/ServerError'
  /user/teams/count:
    get:
      operationId: getUserTeamsCount
      summary: 'Get count of the teams the user can access'
      description: "Returns the number of teams the authenticated user belongs to where their own\nTenantSettings record is not `Inactive`, using the same rule as `/user/teams`.\nThis is useful for determining whether to show team selection UI on login.\n"
      tags:
        - Teams
      security:
        -
          sanctum: {}
      responses:
        200:
          description: 'Team count retrieved successfully'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { count: { type: integer, description: 'Number of teams the user belongs to', example: 2 } } } } }
              examples: { single_team: { summary: 'User belongs to one team', value: { data: { count: 1 } } }, multiple_teams: { summary: 'User belongs to multiple teams', value: { data: { count: 3 } } }, no_teams: { summary: 'User belongs to no teams', value: { data: { count: 0 } } } }
        401:
          description: 'Authentication token is missing or invalid'
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: Unauthenticated. } } }
        500:
          $ref: '#/components/responses/ServerError'
  /users:
    get:
      operationId: listUsers
      summary: 'List team members'
      description: "Returns a paginated list of team members (user directory).\n\n**Authorization:** Admins and managers only.\n"
      tags:
        - 'User Directory'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/UserPerPage'
        -
          name: 'filter[search]'
          in: query
          description: 'Search by name'
          schema:
            type: string
          example: John
        -
          name: 'filter[role]'
          in: query
          description: 'Filter by role'
          schema:
            type: string
            enum:
              - Admin
              - Manager
              - PA
              - 'Family Member'
              - Contractor
          example: Manager
        -
          name: sort
          in: query
          description: 'Sort field (prefix with - for descending)'
          schema:
            type: string
            enum:
              - name
              - created_at
              - '-name'
              - '-created_at'
          example: name
      responses:
        200:
          description: 'Team members retrieved'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/UserDirectoryEntry' } }, meta: { $ref: '#/components/schemas/UserPaginationMeta' }, links: { $ref: '#/components/schemas/UserPaginationLinks' } } }
              example: { data: [{ id: '5', type: users, attributes: { name: 'John Doe', avatar: 'https://...', role: PA } }], meta: { current_page: 1, from: 1, to: 1, per_page: 20, total: 1, last_page: 1, team_id: 1 }, links: { first: 'https://suptmgr.test/api/v1/users?page=1', last: 'https://suptmgr.test/api/v1/users?page=1', prev: null, next: null } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/ServerError'
  /users/options:
    get:
      operationId: listUserOptions
      summary: 'List colleagues for pickers'
      description: "Returns every active member of the current team (active or invited),\nordered by name, with just enough to render a picker: id, name and\navatar. Use it to choose colleagues, for example an injured person on\nan accident report or the viewers and assignee of an appointment.\nNot paginated.\n\n**Authorization:** All roles except former PAs.\n"
      tags:
        - 'User Directory'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'Active team members retrieved'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ProfileUserOption' } } } }
              example: { data: [{ id: '5', type: users, attributes: { name: 'Ada Lovelace', avatar: 'https://...' } }] }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/ServerError'
  '/users/{id}':
    get:
      operationId: getUser
      summary: 'Get team member profile'
      description: "Get a team member's profile.\n\n**Authorization:** Admins and managers only. The user must be in the same team.\n"
      tags:
        - 'User Directory'
      security:
        -
          sanctum: {}
      parameters:
        -
          $ref: '#/components/parameters/UserId'
        -
          $ref: '#/components/parameters/XTeamID'
      responses:
        200:
          description: 'User profile retrieved'
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/UserProfile' } } }
              example: { data: { id: '5', type: users, attributes: { name: 'John Doe', avatar: 'https://...', role: PA, mobile_number: '+44 7700 900000' } } }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/ServerError'
tags:
  -
    name: 'Accident Book'
    description: "The team's accident book, for recording workplace accidents in line with\nHSE guidance.\n\nAdmins, managers and personal assistants can record accidents and read\nthe reports they may see. The person who had the accident can confirm the\nreport later. Recording the RIDDOR outcome is web-only.\n"
  -
    name: Authentication
    description: "Secure user authentication and session management using Laravel Sanctum with dual-token system.\n\n## Flows\n\n**Login**: `email/password` → `access_token + refresh_token`\n**API Requests**: Use `Bearer {access_token}` in Authorization header\n**Refresh**: Exchange `refresh_token` for new `access_token`\n**Password Reset**: Request OTP → Verify OTP → Reset with new password\n\n## Tokens\n\n- **Access**: 1-hour lifespan, for API requests\n- **Refresh**: 30-day lifespan, for token renewal\n- **Reset**: 5-minute lifespan, single-use for password reset\n- **Companion**: issued to a paired device (e.g. Apple Watch) via\n  `/auth/companion-token`; 1-hour access, 7-day refresh\n\nOptimized for mobile apps with Face ID/Touch ID support.\n"
  -
    name: 'Automatic Pay Enhancements'
    description: "Automatic pay enhancement configuration for auto-applying enhancements to shifts.\n\nConfigure which pay enhancements should be automatically applied to shifts\nbased on specific conditions:\n- **Bank Holiday**: Applied to shifts on bank holidays\n- **Christmas Day**: Applied to shifts on Christmas Day\n- **Holiday Cover**: Applied when covering for colleagues on holiday\n- **Sickness Cover**: Applied when covering for colleagues on sick leave\n\n**Authorization:** Privileged users only (Admin/Manager)\n"
  -
    name: 'Bank Holidays'
    description: "Read-only endpoint for UK bank holidays within a date range.\n\nHolidays are sourced from the GOV.UK bank holidays API and filtered by\nthe team's configured region.\n"
  -
    name: 'Calendar Feed'
    description: "Subscribe a calendar app to the team's appointments.\n"
  -
    name: 'Car Journeys'
    description: "Car journey tracking and management.\n\nTrack vehicle usage with start/end times, driver information, and optional comments.\nSupports both logging completed journeys and real-time tracking of ongoing journeys.\n\n**Key Features:**\n- Log completed journeys with full details\n- Start/finish ongoing journeys in real-time\n- Filter by user or driver; admins and managers can also filter by date range or ongoing status\n- Admins and managers see the full history; everyone else sees journeys completed in the last 30 days\n- 12-hour edit window for completed journeys (owners)\n- Privileged users can edit any journey at any time\n- Shift workers can only use car journeys from an hour before their shift until an hour after it\n"
  -
    name: 'Chore Categories'
    description: 'Read-only listing of chore categories used to group chores within a household.'
  -
    name: Chores
    description: "Recurring household chore tracking.\n\nDefine chores with a frequency (Daily, Three Days, Weekly, Fortnightly, Monthly, or Custom),\nrecord when they were last completed, and highlight overdue items.\n"
  -
    name: Consumables
    description: "Household consumables such as wipes or gloves, each with size variants whose\nstock any team member can count up or down.\n"
  -
    name: 'DBS Checks'
    description: "DBS (Disclosure and Barring Service) check records for team members.\n\n## Authorization\n- **PAs and managers (non-privileged access):** Can only view their own DBS checks\n- **Privileged users (Admin/Manager):** Can view all team DBS checks\n- **Employees (PAs, managers and admins):** Can submit and replace their own DBS check\n- **Family members and contractors:** Cannot list, view or submit DBS checks\n"
  -
    name: Dashboard
    description: "The dashboard layout for the current team, and what the signed-in user can\ndo there.\n\n## What the dashboard returns, and what it does not\n\n`GET /dashboard` describes **how the dashboard is put together**: which\nwidgets this user sees, how wide each one renders and in what order, the\nquick links beneath them, and the alerts the web app raises for the user.\nIt does not return the widgets' contents. Each widget's own module\nendpoint serves its data:\n\n| Widget key | Data from |\n|------------|-----------|\n| `dashboard.weather` | Web app only |\n| `tasks.getting-started` | `GET /tasks` and `GET /tasks/progress` |\n| `household.chores` | `GET /household/chores` |\n| `household.bin-day` | Web app only |\n| `payroll.payslip-notification` | `GET /payroll/payslips/latest` |\n| `payroll.estimated-pay` | `GET /payroll/estimated-pay` |\n| `rota.appointments` | `GET /rota/appointments/upcoming` |\n| `rota.today-rota` | `GET /rota/shifts/today` |\n| `rota.available-shifts` | `GET /rota/shifts/available` |\n| `leave.leave-summary` | `GET /leave/balance` |\n\nClients should skip widget keys they do not recognise.\n\n## Capabilities\n\n`GET /capabilities` tells the client which parts of the app to show: the\nuser's role in the team, whether the team is subscribed, which plan\nfeatures and optional modules the team has, and the navigation the web\napp gives this user. It still answers for a team without a subscription,\nso the client can explain why everything else returns `403`.\n\n## Authentication\n\n`/dashboard` and `/capabilities` take the Sanctum access token the rest of\nthis document uses, with the team in `X-Team-ID`. A refresh token is\nrefused with `403`.\n\n`/oauth/dashboard` is the OAuth version of the dashboard layout. It needs a\nPassport bearer token carrying the `dashboard:read` scope, and still\nreturns each widget's Blade component name rather than a key.\n"
  -
    name: 'Document Folders'
    description: "Document folder listing for organizing documents.\n\n**Authorization:** All team members except contractors and former PAs see the team's folders. Everyone except contractors sees their own personal folders, and privileged users (Admin/Manager) also see colleagues' personal folders.\n"
  -
    name: Documents
    description: "Document management for team members.\n\n## Authorization\n- **Non-privileged users:** Can view their own documents and team documents shared with the whole team\n- **Privileged users (Admin/Manager):** Can view every personal document, and the same team documents as everyone else\n- **Former PAs:** Can view only their own personal documents\n- **Contractors:** No access\n"
  -
    name: 'Drivers Licence Checks'
    description: "Drivers licence verification records for team members.\n\n## Authorization\n- **PAs and managers (non-privileged access):** Can only view their own checks\n- **Privileged users (Admin/Manager):** Can view all team checks\n- **Employees (PAs, managers and admins):** Can submit and replace their own check\n- **Family members and contractors:** Cannot list, view or submit drivers licence checks\n"
  -
    name: E-signing
    description: "Filling in and signing documents sent to the user for electronic signature.\n\n## Authorization\nAny team member except former PAs can use these endpoints, but only for requests addressed to them.\nUse `meta.can` on each request to decide whether to offer signing or downloading the signed copy.\n"
  -
    name: 'Estimated Pay'
    description: "Estimated pay calculation based on scheduled shifts.\n\nProvides a preview of expected earnings before the official payslip is generated.\n"
  -
    name: 'Holiday Admin'
    description: "Administrative endpoints for holiday management providing comprehensive team-wide oversight.\n\n**Authorization:** All endpoints require Manager or Admin role.\n\n## Features\n- Pending requests dashboard with bulk approval/rejection\n- Team-wide balance overview\n- Entitlement management (create, update, delete)\n- Team summary dashboard with low balance warnings\n"
  -
    name: 'Holiday Balance'
    description: "Real-time holiday balance calculations showing entitlement, pending, approved, and remaining allowances.\n\n**Authorization:**\n- All users can view their own balance\n- Privileged users can view any team member's balance\n"
  -
    name: 'Holiday Entitlements'
    description: "Holiday entitlement records showing allocated hours and sleeping nights per user per year.\n\n**Authorization:**\n- Non-privileged users see only their own entitlements\n- Privileged users see all team entitlements\n"
  -
    name: 'Holiday Requests'
    description: "Holiday request management including creating, viewing, updating, and processing approval workflows.\n\n## Workflow\n1. Employee creates a holiday request (status: Pending)\n2. Manager/Admin reviews and approves or rejects\n3. Employee or Manager can cancel if needed\n\n## Authorization\n- **All users:** Can create requests, view own requests\n- **Privileged users (Admin/Manager):** Can view all requests, approve, reject\n- **Administrators only:** Can permanently delete requests\n"
  -
    name: Keysafe
    description: "Household keysafe code management.\n\nThe keysafe code is encrypted at rest. Viewing the code (`POST /keysafe/reveal`)\nwrites a `KeysafeCodeRevealed` security audit event; changing it writes\n`KeysafeCodeChanged`. Editing is restricted to admins and managers.\n"
  -
    name: 'Manual Adjustments'
    description: "Manual holiday balance adjustments for carrying over leave, TOIL, or corrections.\n\n**Authorization:** Privileged users only (Admin/Manager)\n"
  -
    name: 'Meal Plan'
    description: "Weekly meal plan for the household.\n\nOne meal plan per team; each weekday holds a free-form meal name (or `null`).\nUpdates merge with the existing plan day-by-day.\n"
  -
    name: Notifications
    description: "In-app notification management for the authenticated user.\n\nThese are user-level endpoints (not tenant-scoped) - notifications are\nassociated with the user account across all teams. No `X-Team-ID` header\nis required.\n\n## Response shape inconsistency\n\nThe list endpoint (`GET /notifications`) returns a JSON:API envelope\n(`application/json`) with `data` and `meta`. All mutating\nendpoints (mark read/unread, delete, mark-all, destroy-all) return a\nplain JSON body of the form `{ \"success\": true, \"message\": \"...\" }`.\n404 responses from per-notification endpoints return `{ \"message\": \"...\" }`.\n"
  -
    name: 'P45 Documents'
    description: "P45 documents issued to employees when they leave.\n\nEach P45 is a snapshot of the details at the moment it was issued, so later\nchanges to the employee's profile or the employer settings do not alter it.\n"
  -
    name: 'P60 Documents'
    description: "P60 document management for end-of-year tax summaries.\n\nP60s are issued after the end of each tax year (April 6 - April 5) and contain\ntotal earnings and tax deductions for the year.\n"
  -
    name: 'Pay Enhancements'
    description: "Pay enhancement management for configuring premium rates.\n\nPay enhancements are multipliers applied to hourly rates for specific\ncircumstances like bank holidays, weekend work, or emergency callouts.\n\n## Enhancement Factors\n- **Time and a quarter (1.25x)**: 25% additional pay\n- **Time and a half (1.5x)**: 50% additional pay\n- **Time and three quarters (1.75x)**: 75% additional pay\n- **Double time (2x)**: 100% additional pay\n\n**Authorization:** Privileged users only (Admin/Manager)\n"
  -
    name: 'Pay Runs'
    description: "Pay run management for monthly payslip aggregations.\n\n**Authorization:** Non-privileged users see pay runs derived from their own payslips; privileged users (Admin/Manager) see team-wide aggregations.\n"
  -
    name: Payslips
    description: "Payslip management for viewing salary and payment information.\n\n## Features\n- List payslips with filtering by year/month\n- Get latest upcoming payslip for notifications\n- View detailed breakdown including payments, deductions, and totals\n- Download payslips as PDF\n"
  -
    name: Policies
    description: "Company policy management including viewing and acknowledging policies.\n\n## Policy Categories\n- `hr` - Human Resources\n- `health_and_safety` - Health & Safety\n- `procedures` - Procedures\n- `safeguarding` - Safeguarding\n- `data_protection` - Data Protection\n- `quality_assurance` - Quality Assurance\n- `training` - Training\n- `general` - General\n\n## Authorization\n- **All users except contractors:** Can view the team's active policies and acknowledge them\n"
  -
    name: 'Push Notifications'
    description: "FCM device token management for push notifications.\n\nAll endpoints are tenant-scoped — the `X-Team-ID` header is required on\nevery request. Tokens themselves are globally unique (an FCM token belongs\nto exactly one device), so re-registering an existing token moves it to\nthe current user and team rather than creating a duplicate.\n\n## Features\n\n- Register / refresh an FCM device token\n- List tokens registered in the current tenant\n- Check notification status and prompt-dismissed preference\n- Remove a specific token or all tokens in the tenant\n"
  -
    name: 'Quick Add'
    description: "Turn a spoken or typed phrase into a rota entry or appointment.\n\n## Flow\n\n1. `POST /rota/quick-add/parse` with the text and the device's timezone —\n   returns a token immediately\n2. Poll `GET /rota/quick-add/parse/{token}` until it stops saying `pending`\n3. Show the user what was understood, and let them correct it\n4. On confirmation, call `POST /rota/appointments` or `POST /rota/shifts`\n\nParsing never creates anything. Step 4 is the only step that writes, and it\nonly happens because a person said so.\n"
  -
    name: 'Right to Work'
    description: "Right-to-work verification records for team members.\n\n## Authorization\n- **PAs and managers (non-privileged access):** Can only view their own records\n- **Privileged users (Admin/Manager):** Can view all team records\n- **Employees (PAs, managers and admins):** Can submit and replace their own record\n- **Family members and contractors:** Cannot list, view or submit right-to-work records\n"
  -
    name: 'Shift Amendments'
    description: "Ask the managers to change a shift you are already on. Managers review\namendments on the web.\n"
  -
    name: 'Shift Applications'
    description: "Endpoints for applying to available shifts.\n\n## Workflow\n1. User views available shifts\n2. User applies for a shift (full or partial)\n3. Manager reviews and approves/rejects the application\n4. If approved, user is assigned to the shift\n\n## Features\n- Full shift applications\n- Partial/split shift applications\n- Sleepover applications, applied for and withdrawn as a whole\n"
  -
    name: 'Shift Requests'
    description: "Ask the managers for extra hours. Managers review requests on the web.\n"
  -
    name: Shifts
    description: "Shift management endpoints for viewing and managing shifts.\n\n## Endpoints\n- **List shifts**: View shifts for a date range (own shifts, or any user for privileged users)\n- **Get shift**: View details of a specific shift\n- **Today's shifts**: View all published shifts scheduled for today\n- **Available shifts**: View unassigned shifts that team members can apply for\n"
  -
    name: 'Shopping List'
    description: "Shopping list management for the household.\n\nTrack items the household needs to buy, mark them as purchased,\nand record the last-purchased date for re-ordering insights.\n"
  -
    name: 'Starter Declaration'
    description: "The employee's own payroll starter declaration (P45 or new starter checklist).\n\nSaving it completes the `payroll.payroll_starter` task.\n"
  -
    name: Tasks
    description: "Task management for onboarding and compliance tracking.\n\n## Task Types\n\nTasks are categorized by who can complete them:\n- **self**: Only the employee can complete (e.g., providing personal information)\n- **manager**: Only a manager can complete (e.g., reviewing compliance documents)\n- **both**: Either the employee or a manager can complete\n\n## Task Visibility\n\n- The list endpoint returns the authenticated user's own visible tasks\n  (manager-only tasks are hidden from non-privileged users)\n- Manager and team-wide views are available via the `manager-inbox` and\n  `team-progress` endpoints\n\n## Manager Inbox\n\nPrivileged users have access to a manager inbox showing all pending tasks\nthat require manager action across all team members.\n\n## Completing Tasks\n\nA task completes when the record it asks for is saved through its own\nmodule's endpoint, which marks it complete. `POST /tasks/{taskKey}/complete`\nonly refreshes the cached task counts afterwards.\n\n| Task key | Completion role | Completed by |\n|----------|-----------------|--------------|\n| `profile.address` | both | `PUT /user/address` |\n| `profile.emergency_contact` | both | `PUT /user/emergency-contacts` |\n| `payroll.bank_details` | both | `PUT /user/bank-details` |\n| `payroll.payroll_starter` | both | `PUT /payroll/starter-declaration` |\n| `payroll.rate_of_pay` | manager | Web app only: the employee's employment record |\n| `compliance.dbs_check` | both | `POST /compliance/dbs-checks` |\n| `compliance.drivers_licence` | both | `POST /compliance/drivers-licence-checks` |\n| `compliance.right_to_work` | both | `POST /compliance/right-to-work` |\n| `compliance.dbs_check_review` | manager | Web app only: the DBS check review |\n| `compliance.drivers_licence_review` | manager | Web app only: the driving licence review |\n"
  -
    name: Teams
    description: "Team management endpoints for authenticated users.\n\nProvides access to team memberships and team information.\n"
  -
    name: Timesheets
    description: "Timesheet management for viewing work hours and earnings.\n\n## Features\n- List timesheets with filtering by year/month/status\n- View timesheet details including hours, sleeps, and additional payments\n- Download timesheets as PDF\n"
  -
    name: User
    description: "User profile endpoints for authenticated users.\n\nProvides access to user information and account details.\n"
  -
    name: 'User Directory'
    description: "Endpoints for viewing team member information.\nReturns limited data for privacy.\n"
  -
    name: 'User Profile'
    description: "Endpoints for managing the authenticated user's profile, address,\nemergency contacts, avatar, password, bank details and employment.\n\nFormer PAs can read their profile, address, emergency contacts, bank\ndetails and employment summary, and nothing else; every write returns\n`403`. `FullProfile.is_view_only` tells the client to hide edit\ncontrols.\n"
